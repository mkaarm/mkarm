function renderDocumentRenewalTable(){
  const body = $('#drBody');
  if(!body) return;

  const days = docRenewalState.days;
  const tab = docRenewalState.tab;
  const selected = docRenewalState.selected;

  // ═══ بناء القائمة ═══
  let list = state.employees.filter(e => e.status === 'يعمل').map(emp => {
    const resExp = emp.idExpiry || '';
    const passExp = emp.passportExpiry || '';
    const insExp = (emp.insurance && emp.insurance.endDate) || '';

    const resDays = resExp ? daysUntil(resExp) : null;
    const passDays = passExp ? daysUntil(passExp) : null;
    const insDays = insExp ? daysUntil(insExp) : null;

    const hasRelevant =
      (resDays !== null && resDays <= days) ||
      (passDays !== null && passDays <= days) ||
      (insDays !== null && insDays <= days);

    return { emp, resExp, passExp, insExp, resDays, passDays, insDays, hasRelevant };
  }).filter(x => x.hasRelevant);

  // ═══ فلتر التبويب ═══
  if(tab === 'residency') list = list.filter(x => x.resDays !== null && x.resDays <= days);
  if(tab === 'passport') list = list.filter(x => x.passDays !== null && x.passDays <= days);
  if(tab === 'insurance') list = list.filter(x => x.insDays !== null && x.insDays <= days);

  // ═══ ترتيب حسب الأقرب ═══
  list.sort((a,b) => {
    const aMin = Math.min.apply(null, [a.resDays, a.passDays, a.insDays].filter(d => d !== null));
    const bMin = Math.min.apply(null, [b.resDays, b.passDays, b.insDays].filter(d => d !== null));
    return aMin - bMin;
  });

  const counter = $('#drCount'); if(counter) counter.textContent = list.length;

  if(!list.length){
    body.innerHTML = `<tr><td colspan="9" class="empty">✨ لا موظفون لديهم وثائق قريبة الانتهاء خلال ${days} يوم</td></tr>`;
    return;
  }

  // ═══ دالة شارة الانتهاء + زر التجديد ═══
  const expiryCell = (date, d, type, empId) => {
    if(!date) return '<span class="muted">—</span>';
    let color = '#16a34a', bg = '#dcfce7', icon = '✅';
    if(d < 0){ color = '#dc2626'; bg = '#fee2e2'; icon = '❌'; }
    else if(d <= 7){ color = '#dc2626'; bg = '#fee2e2'; icon = '🔴'; }
    else if(d <= 30){ color = '#ea580c'; bg = '#fed7aa'; icon = '🟠'; }
    else if(d <= 90){ color = '#d97706'; bg = '#fef3c7'; icon = '🟡'; }

    const dayLabel = d < 0 ? `متأخر ${Math.abs(d)} يوم` : `باقي ${d} يوم`;

    return `<div style="display:flex;flex-direction:column;gap:5px;align-items:flex-start">
      <span style="background:${bg};color:${color};padding:5px 11px;border-radius:99px;font-size:11.5px;font-weight:800;display:inline-block;white-space:nowrap">${icon} ${date}</span>
      <span style="font-size:10.5px;color:${color};font-weight:700">${dayLabel}</span>
      <button class="btn sm primary" style="font-size:11px;padding:4px 10px" onclick="openRenewDocumentModal('${empId}','${type}')">🔄 تجديد</button>
    </div>`;
  };

  // ═══ رسم الصفوف ═══
  body.innerHTML = list.map((item, i) => {
    const emp = item.emp;
    const isSelected = selected.indexOf(emp.id) !== -1;
    return `<tr style="${isSelected ? 'background:#eef2ff' : ''}">
      <td><input type="checkbox" ${isSelected ? 'checked' : ''} onchange="toggleDocRenewalSelect('${emp.id}', this.checked)" style="width:16px;height:16px;accent-color:var(--primary);cursor:pointer"></td>
      <td><span style="font-weight:800;color:var(--primary)">${i+1}</span></td>
      <td><span style="font-family:monospace;font-size:11.5px;background:#f1f5f9;padding:4px 8px;border-radius:6px">EMP-${esc(emp.empNumber||'—')}</span></td>
      <td>
        <div style="display:flex;gap:8px;align-items:center">
          <div style="width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;display:grid;place-items:center;font-weight:800;font-size:12px;flex:none">${initials(emp.name)}</div>
          <div style="min-width:0">
            <div style="font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(emp.name)}</div>
            <div class="muted small" style="font-size:10.5px">${esc(emp.position||'—')}</div>
          </div>
        </div>
      </td>
      <td><span dir="ltr" style="font-family:monospace;font-size:12px">${esc(emp.nationalId||'—')}</span></td>
      <td>${expiryCell(item.resExp, item.resDays, 'residency', emp.id)}</td>
      <td>${expiryCell(item.passExp, item.passDays, 'passport', emp.id)}</td>
      <td>${expiryCell(item.insExp, item.insDays, 'insurance', emp.id)}</td>
      <td style="text-align:center">
        <button class="btn sm ghost" onclick="viewEmpProfile('${emp.id}')" title="عرض ملف الموظف">📂 عرض الملف</button>
      </td>
    </tr>`;
  }).join('');
}

/* ═══ إدارة التحديد ═══ */
function toggleDocRenewalSelect(empId, checked){
  if(checked){
    if(docRenewalState.selected.indexOf(empId) === -1) docRenewalState.selected.push(empId);
  } else {
    docRenewalState.selected = docRenewalState.selected.filter(x => x !== empId);
  }
  renderDocumentRenewalTable();
}

function toggleAllDocRenewal(checked){
  if(checked){
    docRenewalState.selected = [];
    $$('#drBody input[type=checkbox]').forEach(cb => {
      const match = cb.getAttribute('onchange').match(/'([^']+)'/);
      if(match && match[1]) docRenewalState.selected.push(match[1]);
    });
  } else {
    docRenewalState.selected = [];
  }
  renderDocumentRenewalTable();
}

      getExpiry: () => emp.idExpiry },
    passport: { label:'الجواز', icon:'📘', color:'#7c3aed', number: emp.passportNo,
      getExpiry: () => emp.passportExpiry },
    insurance: { label:'التأمين', icon:'🏥', color:'#16a34a', number: emp.insurance && emp.insurance.policy,
      getExpiry: () => emp.insurance && emp.insurance.endDate }
  };
  const config = configs[docType];
  if(!config){ toast('⚠️ نوع غير مدعوم','error'); return; }

  const currentExpiry = config.getExpiry() || '';

  // ═══ حساب الخيارات الأربعة ═══

  const options = [3,6,9,12].map(m => {
    const d = new Date(baseDate);
    d.setMonth(d.getMonth() + m);
    return { months: m, date: isoDate(d) };

  openModal(`🔄 تجديد ${config.label} — ${emp.name}`, `

      .renew-hero{background:linear-gradient(135deg,${config.color},${config.color}cc);color:#fff;border-radius:14px;padding:18px 20px;margin-bottom:16px}
      .renew-hero h3{font-size:16px;font-weight:800;margin-bottom:6px}
      .renew-hero p{font-size:12.5px;opacity:.92;line-height:1.7}
      .renew-info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
      .renew-info-box{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:10px 14px}
      .renew-info-box .lbl{font-size:11.5px;color:#64748b;margin-bottom:4px}
      .renew-info-box .val{font-weight:800;font-size:14px;color:#0f172a}
      .renew-options{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
      .renew-opt{cursor:pointer;border:2px solid var(--border);border-radius:12px;padding:16px 8px;text-align:center;background:#fff;transition:.2s}
      .renew-opt:hover{border-color:${config.color};background:#f8fafc;transform:translateY(-2px)}
      .renew-opt.selected{border-color:${config.color};background:${config.color}15;box-shadow:0 0 0 3px ${config.color}30}
      .renew-opt .m{font-size:26px;font-weight:800;color:${config.color};line-height:1;font-family:monospace}
      .renew-opt .t{font-size:11.5px;color:#64748b;margin-top:4px;font-weight:700}
      .renew-opt .d{font-size:11px;color:#475569;margin-top:8px;padding-top:8px;border-top:1px dashed #e2e8f0;font-family:monospace}
      @media(max-width:600px){.renew-options{grid-template-columns:repeat(2,1fr)}}
    </style>

    <div class="renew-hero">
      <h3>${config.icon} تجديد ${config.label}</h3>
      <p>اختر مدة التجديد المناسبة (3 أو 6 أو 9 أو 12 شهر) وسيتم تحديث تاريخ الانتهاء تلقائياً وإضافة سجل بالتجديد.</p>
    </div>

    <div class="renew-info-grid">
      <div class="renew-info-box">
        <div class="lbl">الموظف</div>
        <div class="val">${esc(emp.name)}</div>
      </div>
      <div class="renew-info-box">
        <div class="lbl">الرقم الوظيفي</div>
        <div class="val" style="font-family:monospace">EMP-${esc(emp.empNumber||'—')}</div>
      </div>
      <div class="renew-info-box">
        <div class="lbl">رقم ${config.label}</div>
        <div class="val" style="font-family:monospace;font-size:12px">${esc(config.number||'—')}</div>
      </div>
      <div class="renew-info-box">
        <div class="lbl">الانتهاء الحالي</div>
        <div class="val" style="color:${currentExpiry && daysUntil(currentExpiry) < 0 ? '#dc2626' : '#0f172a'}">${currentExpiry || '—'}</div>

      <h3 style="font-size:16px;font-weight:800;margin-bottom:6px">${config.icon} تجديد جماعي</h3>

/* ═══ اختيار المدة ═══ */
function pickRenewOption(el){
  $$('#renewOpts .renew-opt').forEach(o => o.classList.remove('selected'));
  el.classList.add('selected');
}
function pickBulkOption(el){
  $$('#bulkOpts .bulk-opt').forEach(o => o.classList.remove('selected'));
  el.classList.add('selected');
}

/* ═══ تطبيق التجديد على مستوى البيانات ═══ */
function applyRenewal(empIds, docType, newDate, months, notes){
  if(!empIds || !empIds.length) return;

  const typeLabels = { residency:'الإقامة', passport:'الجواز', insurance:'التأمين' };
  const typeLabel = typeLabels[docType] || docType;
  const today = todayISO();

  empIds.forEach(empId => {
    const emp = empById(empId);
    if(!emp) return;

    let oldDate = '';
    if(docType === 'residency'){
      oldDate = emp.idExpiry || '';
      emp.idExpiry = newDate;
    } else if(docType === 'passport'){
      oldDate = emp.passportExpiry || '';
      emp.passportExpiry = newDate;
    } else if(docType === 'insurance'){
      if(!emp.insurance) emp.insurance = {};
      oldDate = emp.insurance.endDate || '';
      emp.insurance.endDate = newDate;
    }

    // سجل في state.documents
    state.documents.push({
      id: uid(),
      empId: empId,
      type: typeLabel,
      name: `${typeLabel} — تجديد ${months} شهر`,
      number: docType === 'residency' ? emp.nationalId :
              docType === 'passport' ? emp.passportNo :
              (emp.insurance && emp.insurance.policy) || '',
      issueDate: today,
      expiryDate: newDate,
      notes: notes || `تجديد لمدة ${months} شهر`,
      createdAt: today,
      createdBy: (session && session.username) || 'system'
    });

    logAction(`تجديد ${typeLabel}`, 'الوثائق', `${emp.name}: ${oldDate||'—'} → ${newDate} (${months} شهر)`);
  });

  save();
  buildNav();
  renderNotifs();
  if(currentView === 'documentRenewal') renderDocumentRenewalTable();
}

function moveCandidate(id, dir){
  const stages = ['فرز أولي','مقابلة أولى','اختبار تقني','عرض عمل'];
  const c = state.candidates.find(x=>x.id===id);
  if(!c) return;
  const idx = stages.indexOf(c.stage);
  const newIdx = dir==='next' ? Math.min(stages.length-1, idx+1) : Math.max(0, idx-1);
  c.stage = stages[newIdx];
  save(); go('recruitment');
  toast('✅ نُقل إلى: '+c.stage,'success');
}

function backupData(){

  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='hr-backup-'+todayISO()+'.json';
  document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(a.href);toast('⬇','success');
}
function restoreData(ev){
  const f=ev.target.files[0];if(!f)return;
  const reader=new FileReader();
  reader.onload=e=>{try{const d=JSON.parse(e.target.result);
    if(!d.employees)throw new Error();
    if(!confirm('استبدال؟'))return;
    Object.keys(d).forEach(k=>state[k]=d[k]);
    save();toast('✅','success');setTimeout(()=>location.reload(),900);
  }catch(err){toast('❌ ملف غير صالح','error');}};
  reader.readAsText(f);
}

/* ══════════ Assistant ══════════ */
function initAssistant(){
  if(!assistantHistory.length){
    assistantHistory=[{role:'bot',text:'👋 أهلاً! جرّب: "ملخص" • "كم موظف" • "الطلبات المعلقة" • "رصيد إجازات أحمد"',ts:new Date()}];
  }
  renderAssistQuick();renderAssistBody();
}
function renderAssistQuick(){
  const el=$('#assistQuick');if(!el)return;
  const quick=[
    {l:'📊 ملخص',q:'ملخص'},{l:'👥 موظفين',q:'كم عدد الموظفين'},
    {l:'🕐 حضور',q:'من حضر اليوم'},{l:'📋 طلبات',q:'الطلبات المعلقة'},
    {l:'💳 مطالبات',q:'المطالبات المعلقة'},{l:'🌴 إجازات',q:'الإجازات المعلقة'}];
  el.innerHTML=quick.map(x=>`<button class="assist-qbtn" onclick="document.getElementById('assistInput').value='${x.q}';sendAssistantMsg()">${x.l}</button>`).join('');
}
function toggleAssistant(){
  if(session?.role!=='admin')return;
  assistantOpen=!assistantOpen;
  const p=$('#assistPanel'),i=$('#assistFabIcon');
  if(assistantOpen){p.classList.add('open');i.textContent='✕';if(!assistantHistory.length)initAssistant();setTimeout(()=>$('#assistInput').focus(),200);}
  else{p.classList.remove('open');i.textContent='🤖';}
}
function clearAssistantHistory(){assistantHistory=[];initAssistant();toast('🔄','success');}
function assistKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendAssistantMsg();}}
function sendAssistantMsg(){
  const input=$('#assistInput');if(!input)return;
  const text=input.value.trim();if(!text||assistantProcessing)return;
  assistantHistory.push({role:'user',text,ts:new Date()});
  input.value='';renderAssistBody();
  assistantProcessing=true;$('#assistSend').disabled=true;
  setTimeout(()=>{
    const r=parseAssist(text);
    assistantHistory.push({role:'bot',text:r,ts:new Date()});
    assistantProcessing=false;$('#assistSend').disabled=false;
    renderAssistBody();
  },400);
}
function renderAssistBody(){
  const body=$('#assistBody');if(!body)return;
  let html=assistantHistory.map(m=>`<div class="assist-msg ${m.role==='user'?'user':''}">
    <div class="assist-msg-avatar">${m.role==='user'?initials(empName(myEmpId())||session.username):'🤖'}</div>
    <div class="assist-msg-body">${m.role==='user'?esc(m.text):m.text}</div></div>`).join('');
  if(assistantProcessing)html+=`<div class="assist-msg"><div class="assist-msg-avatar">🤖</div>
    <div class="assist-msg-body" style="display:flex;gap:4px"><span>●</span><span>●</span><span>●</span></div></div>`;
  body.innerHTML=html;
  setTimeout(()=>body.scrollTop=body.scrollHeight,30);
}
function parseAssist(q){
  const query=q.toLowerCase(),myId=myEmpId();
  const findEmp=t=>{const s=t.replace(/[؟?،,.!]/g,' ').trim();
    let f=state.employees.find(e=>e.name===s);if(f)return f;
    for(const w of s.split(/\s+/).filter(x=>x.length>1)){f=state.employees.find(e=>e.name.includes(w));if(f)return f;}
    return null;};
  if(/^(السلام|مرحبا|هلا|أهلا|hi|hello)/.test(query)||query.length<3){
    return '👋 أهلاً! جرّب "ملخص" أو "مساعدة"';}
  if(/مساعدة|help/.test(query)){
    return `🤖 <strong>أوامر:</strong><br>• ملخص<br>• كم موظف<br>• رصيد إجازات [اسم]<br>• من حضر اليوم<br>• الطلبات المعلقة<br>• المطالبات المعلقة<br>• استبياناتي`;}
  if(/ملخص/.test(query)){
    const today=todayISO();
    return `📊 <strong>ملخص:</strong>
      <div class="stat-line"><span>👥 الموظفون</span><strong>${state.employees.length}</strong></div>
      <div class="stat-line"><span>🕐 حضور اليوم</span><strong>${state.attendance.filter(a=>a.date===today&&(a.status==='حاضر'||a.status==='متأخر')).length}</strong></div>
      <div class="stat-line"><span>📋 طلبات</span><strong>${state.requests.filter(r=>r.status==='معلقة').length}</strong></div>
      <div class="stat-line"><span>💳 مطالبات</span><strong>${state.claims.filter(c=>c.status==='معلقة').length}</strong></div>
      <div class="stat-line"><span>🌴 إجازات</span><strong>${state.leaves.filter(l=>l.status==='معلقة').length}</strong></div>`;}
  if(/كم.*موظف|عدد.*موظف/.test(query)){
    return `👥 <strong>${state.employees.length} موظف</strong> (${state.employees.filter(e=>e.status==='يعمل').length} نشط)`;}
  if(/رصيد.*إجاز|إجازات/.test(query)&&/رصيد/.test(query)){
    if(/رصيدي/.test(query)&&myId)return leaveBalText(myId);
    const emp=findEmp(q.replace(/كم|رصيد|إجازات|إجازة|عن|لـ|ال|؟|\?/g,' ').trim());
    if(emp)return leaveBalText(emp.id);
    return '⚠️ لم أتعرف على الموظف';}
  if(/حضر/.test(query)){
    const today=todayISO();
    const p=state.attendance.filter(a=>a.date===today&&(a.status==='حاضر'||a.status==='متأخر'));
    if(!p.length)return '📭 لا حضور اليوم';
    return `🕐 <strong>${p.length} حاضر:</strong><br>${p.slice(0,10).map(a=>'• '+esc(empName(a.empId))+' — '+a.checkIn).join('<br>')}`;}
  if(/الطلبات المعلقة|طلبات معلقة/.test(query)){
    let list=state.requests.filter(r=>r.status==='معلقة');
    if(isEmployee()&&myId)list=list.filter(r=>r.empId===myId);
    return list.length?'📋 <strong>'+list.length+':</strong><br>'+list.slice(0,10).map(r=>'• '+esc(empName(r.empId))+' — '+esc(r.title)).join('<br>'):'✅ لا توجد';}
  if(/المطالبات المعلقة/.test(query)){
    let list=state.claims.filter(c=>c.status==='معلقة');
    if(isEmployee()&&myId)list=list.filter(c=>c.empId===myId);
    return list.length?'💳 <strong>'+list.length+' ('+money(list.reduce((s,c)=>s+c.amount,0))+'):</strong><br>'+list.map(c=>'• '+esc(empName(c.empId))+' — '+money(c.amount)).join('<br>'):'✅ لا توجد';}
  if(/الإجازات المعلقة/.test(query)){
    const list=state.leaves.filter(l=>l.status==='معلقة');
    return list.length?'🌴 <strong>'+list.length+':</strong><br>'+list.map(l=>'• '+esc(empName(l.empId))+' — '+l.days+' يوم').join('<br>'):'✅ لا توجد';}
  if(/راتب/.test(query)){
    if(/إجمالي/.test(query)){
      const a=state.employees.filter(e=>e.status==='يعمل');
      const t=a.reduce((s,e)=>{const al=e.allowances||{};return s+(Number(e.baseSalary)||0)+(al.housing||0)+(al.transport||0)+(al.food||0);},0);
      return '💰 <strong>إجمالي:</strong> '+money(t);}
    const emp=findEmp(q.replace(/راتب|ال|؟|\?/g,' ').trim())||(myId?empById(myId):null);
    if(emp)return '💰 <strong>'+esc(emp.name)+':</strong> '+money(emp.baseSalary);}
  if(/معلومات|عن/.test(query)){
    const emp=findEmp(q.replace(/معلومات|عن|ال|؟|\?/g,' ').trim());
    if(emp)return `👤 <strong>${esc(emp.name)}</strong>
      <div class="stat-line"><span>💼 الوظيفة</span><strong>${esc(emp.position)}</strong></div>
      <div class="stat-line"><span>🏢 القسم</span><strong>${esc(deptName(emp.deptId))}</strong></div>
      <div class="stat-line"><span>💰 الراتب</span><strong>${money(emp.baseSalary)}</strong></div>`;}

  // 🎯 استبياناتي
  if(/استبيان/.test(query)){
    if(!myId)return '⚠️ غير مرتبط';
    const done=new Set(state.surveyResponses.filter(r=>r.empId===myId).map(r=>r.surveyId));
    const pending=state.surveys.filter(s=>s.status==='نشط'&&!done.has(s.id));
    if(!pending.length)return '✅ لا استبيانات بانتظارك';
    return `🎯 <strong>${pending.length} استبيان بانتظارك:</strong><br>`+pending.map(s=>'• '+esc(s.title)).join('<br>');
  }




  return '🤔 لم أفهم. جرّب "مساعدة"';
}
function leaveBalText(id){
  const b=getLeaveBalance(id),emp=empById(id);
  return `🏖️ <strong>رصيد ${esc(emp.name)}:</strong>

views.fileManager=function(){

    </div></div>
  <input type="file" id="fmUpload" style="display:none" onchange="handleFileUpload(event)">
  <div id="fmRoot"></div>`;

function renderFileManager(){
  const root=$('#fmRoot');if(!root)return;
  const q=($('#fmSearch')?.value||'').toLowerCase();
  const cat=$('#fmCat')?.value||'';
  let list=[...state.files].sort((a,b)=>(b.uploadedAt||'').localeCompare(a.uploadedAt||''));
  if(q)list=list.filter(f=>f.name.toLowerCase().includes(q));
  if(cat)list=list.filter(f=>f.category===cat);
  const totalSize=state.files.reduce((s,f)=>s+(f.size||0),0);
  root.innerHTML=`
    <div class="stats">
      ${statCard('الملفات',state.files.length,'📄','blue')}
      ${statCard('الحجم الإجمالي',(totalSize/1024/1024).toFixed(2)+' MB','💾','purple')}
      ${statCard('المعروض',list.length,'👁️','green')}
    </div>
    ${!list.length?'<div class="card"><div class="empty">لا ملفات</div></div>':`
    <div class="asset-grid">${list.map(f=>{
      const emp=empById(f.empId);
      const ext=(f.name.split('.').pop()||'').toLowerCase();
      const icon=ext==='pdf'?'📕':ext.match(/png|jpg|jpeg|gif/)?'🖼️':ext.match(/doc|docx/)?'📘':ext.match(/xls|xlsx/)?'📗':ext==='zip'?'🗜️':'📄';
      const size=f.size>1024*1024?(f.size/1024/1024).toFixed(1)+' MB':(f.size/1024).toFixed(0)+' KB';
      return `<div class="asset-card" style="flex-direction:column;gap:10px">
        <div style="display:flex;gap:12px;align-items:center">
          <div class="a-ico" style="font-size:22px">${icon}</div>
          <div style="flex:1;min-width:0">
            <div class="a-name" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(f.name)}">${esc(f.name)}</div>
            <div class="a-meta">${badge(f.category||'أخرى','blue')} · ${size}</div>
          </div>
        </div>
        <div class="a-meta">${emp?('👤 '+esc(emp.name)):'📎 عام'} · ${f.uploadedAt||''}</div>
        <div class="row-actions">
          ${f.data?`<a class="btn sm ghost" href="${f.data}" download="${esc(f.name)}">⬇</a>`:''}
          ${f.data?`<a class="btn sm ghost" href="${f.data}" target="_blank">👁</a>`:''}
          <button class="btn sm danger" onclick="deleteFile('${f.id}')">×</button>
        </div>
      </div>`;}).join('')}</div>`}`;
}
function handleFileUpload(ev){
  const files=[...ev.target.files];
  if(!files.length)return;
  const cat=prompt('الفئة (عقود / شهادات / فواتير / تقارير / صور / أخرى):','أخرى')||'أخرى';
  const empId=myEmpId();
  let pending=files.length;
  files.forEach(f=>{
    if(f.size>2*1024*1024){toast('⚠️ '+f.name+' > 2MB','error');pending--;if(!pending){renderFileManager();ev.target.value='';}return;}
    const r=new FileReader();
    r.onload=e=>{
      state.files.push({id:uid(),name:f.name,type:f.type,size:f.size,empId,category:cat,
        uploadedBy:session.username,uploadedAt:todayISO(),data:e.target.result});
      if(--pending===0){save();renderFileManager();ev.target.value='';toast('✅ رُفع '+files.length,'success');}
    };
    r.readAsDataURL(f);
  });
}
function deleteFile(id){
  if(!confirm('حذف الملف؟'))return;
  state.files=state.files.filter(f=>f.id!==id);
  save();renderFileManager();toast('🗑️','success');
}

function printMyQr(){
  const el=$('#myQrBox')?.innerHTML;if(!el)return;

function processQrCheck(empId){
  const emp=empById(empId);if(!emp){toast('❌ موظف غير معروف','error');return;}
  const today=todayISO();
  const att=state.attendance.find(a=>a.empId===emp.id&&a.date===today);
  const now=nowTimeHM();
  if(att&&att.checkOut){toast('⚠️ مسجل مسبقاً','error');return;}
  if(att){att.checkOut=now;att.method='QR';
    const hours=hoursBetween(att.checkIn,now);if(hours>8)att.overtime=Math.round((hours-8)*100)/100;
    save();$('#qrResult').innerHTML=`<div class="form-note" style="background:#fef3c7;border-color:#d97706;color:#b45309">🔴 انصراف: ${esc(emp.name)} — ${now}</div>`;
    toast('✅ انصراف '+emp.name,'success');
  }else{
    const late=state.settings?.lateThreshold||'08:15';
    const status=now>late?'متأخر':'حاضر';
    state.attendance.push({id:uid(),empId:emp.id,date:today,status,checkIn:now,checkOut:'',overtime:0,method:'QR'});
    save();$('#qrResult').innerHTML=`<div class="form-note" style="background:#dcfce7;border-color:#16a34a;color:#15803d">✅ حضور: ${esc(emp.name)} — ${now}</div>`;
    toast('✅ حضور '+emp.name,'success');
  }
  renderNotifs();
}
function startQrScan(){
  if(typeof Html5Qrcode==='undefined'){toast('⚠️ مكتبة الماسح غير محملة','error');return;}
  if(qrScanner){qrScanner.stop().catch(()=>{});qrScanner=null;}
  qrScanner=new Html5Qrcode("qrReader");
  qrScanner.start({facingMode:"environment"},{fps:10,qrbox:{width:250,height:250}},
    (text)=>{
      try{const data=JSON.parse(text);
        if(data.t==='emp'){
          qrScanner.stop().then(()=>{qrScanner=null;processQrCheck(data.id);});
        }
      }catch(e){}
    },
    ()=>{}
  ).catch(e=>toast('❌ الكاميرا غير متاحة: '+e,'error'));
}
function manualQrEntry(){
  openModal('إدخال يدوي',`

}

function voteIdea(id,type){
  const i=state.ideas.find(x=>x.id===id);if(!i)return;
  const myId=myEmpId();if(!myId){toast('⚠️','error');return;}
  if(!i.voters)i.voters=[];
  if(i.voters.includes(myId)){toast('ℹ️ صوّت مسبقاً','');return;}
  i.voters.push(myId);
  if(type==='up')i.upvotes=(i.upvotes||0)+1;else i.downvotes=(i.downvotes||0)+1;

}

/* ══════════ 🎨 Theme System ══════════ */
function applyTheme(){
  const t=state.theme;if(!t)return;
  const r=document.documentElement;
  // الألوان
  const colorMap={primary:'--primary',primary_d:'--primary-d',primary_l:'--primary-l',
    green:'--green',red:'--red',yellow:'--yellow',purple:'--purple',teal:'--teal',
    orange:'--orange',blue:'--blue',gray:'--gray',sidebar:'--sidebar',sidebar_h:'--sidebar-h',
    bg:'--bg',card:'--card',text:'--text',border:'--border'};
  Object.entries(colorMap).forEach(([k,v])=>{if(t[k])r.style.setProperty(v,t[k]);});
  // الخط
  document.body.style.fontFamily=`'${t.font}',system-ui,sans-serif`;
  document.body.style.fontSize=(t.fontSize||14)+'px';
  document.body.style.fontWeight=t.fontWeight||500;
  document.body.style.letterSpacing=(t.letterSpacing||0)+'px';
  document.body.style.lineHeight=t.lineHeight||1.6;
  // زوايا
  r.style.setProperty('--radius',t.radius||'14px');
  r.style.setProperty('--card-radius',t.cardRadius||t.radius||'14px');
  r.style.setProperty('--btn-radius',t.btnRadius||'10px');
  // ظلال
  const shadows={
    none:'none',
    light:'0 2px 6px -2px rgba(15,23,42,.08)',
    normal:'0 12px 24px -14px rgba(15,23,42,.28)',
    strong:'0 20px 40px -12px rgba(15,23,42,.4)',
    glow:'0 0 24px -4px '+(t.primary||'#4f46e5')+'60'
  };
  r.style.setProperty('--shadow',shadows[t.shadow||'normal']);
  // عرض الحدود
  r.style.setProperty('--border-width',(t.borderWidth||1)+'px');
  // الحركات
  if(!t.animations){
    if(!$('#no-anim-style')){const s=document.createElement('style');s.id='no-anim-style';s.textContent='*,*:before,*:after{animation-duration:0s!important;transition-duration:0s!important}';document.head.appendChild(s);}
  }else{const s=$('#no-anim-style');if(s)s.remove();
    const speeds={slow:'0.5s',normal:'0.25s',fast:'0.1s'};
    r.style.setProperty('--transition-speed',speeds[t.animationSpeed||'normal']);
  }
  // الكثافة
  document.body.classList.toggle('dense',t.density==='compact');
  document.body.classList.toggle('comfortable',t.density==='comfortable');
  document.body.classList.toggle('sidebar-left',t.sidebarPosition==='left');
  document.body.classList.toggle('sidebar-compact',t.sidebarStyle==='compact');
  document.body.classList.toggle('sidebar-icons-only',t.sidebarStyle==='icons');
  // الشعار
  const logo=$('.logo');
  if(logo){
    if(t.logoType==='image'&&t.logoImage){logo.innerHTML=`<img src="${t.logoImage}" style="width:100%;height:100%;object-fit:cover;border-radius:inherit">`;logo.style.background='transparent';}
    else{logo.innerHTML='';logo.textContent=(!t.logoText||t.logoText==='HR')?'':t.logoText;logo.style.background='';}
  }
  const bt=$('.brand-title');if(bt)bt.textContent=t.brandTitle||'';
  const bs=$('.brand-sub');if(bs)bs.textContent=t.brandSub||'';
  // الشريط الجانبي
  const sb=$('#sidebar');if(sb)sb.style.width=(t.sidebarWidth||255)+'px';
  const mn=$('.main');
  if(mn){
    const isMobile=window.innerWidth<=900;
    if(t.sidebarPosition==='left'){
      mn.style.marginLeft=isMobile?'0':(t.sidebarWidth||255)+'px';
      mn.style.marginRight='0';
    }else{
      mn.style.marginRight=isMobile?'0':(t.sidebarWidth||255)+'px';
      mn.style.marginLeft='0';
    }
  }
  // شاشة الدخول
  const ls=$('.login-screen');
  if(ls){
    if(t.loginBg==='gradient')ls.style.background='linear-gradient(135deg,#2276a2,#2e5a77 55%,#14384f)';
    else if(t.loginBg==='solid')ls.style.background=t.loginBgColor||t.primary;
    else if(t.loginBg==='dark')ls.style.background='linear-gradient(135deg,#0f172a,#1e293b)';
    else if(t.loginBg==='image'&&t.loginBgImage)ls.style.background=`url(${t.loginBgImage}) center/cover`;
else if(t.loginBg==='pattern'){
  ls.style.background = `
    repeating-linear-gradient(45deg, ${t.primary||'#4f46e5'}22 0 12px, transparent 12px 24px),
    linear-gradient(135deg, ${t.sidebar||'#0f172a'}, ${t.primary||'#4f46e5'})
  `;
}
  }
  const lh=$('.login-box h1');if(lh&&t.loginTitle&&t.loginTitle!=='نظام الموارد البشرية')lh.textContent=t.loginTitle;
  const lp=$('.login-box>p');if(lp)lp.style.display='none';
  // أيقونة الموقع
  if(t.favicon){
    let f=document.querySelector('link[rel="icon"]');
    if(!f){f=document.createElement('link');f.rel='icon';document.head.appendChild(f);}
    f.href=t.favicon;
  }
}

function importTheme(ev){
  const f=ev.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=e=>{try{const d=JSON.parse(e.target.result);
    if(!d.primary)throw new Error();
    state.theme=d;saveTheme();renderSiteCustomization();
    toast('✅ تم الاستيراد','success');
  }catch(err){toast('❌ ملف غير صالح','error');}};
  r.readAsText(f);ev.target.value='';
}

function playNotifSound(){
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const o=ctx.createOscillator();const g=ctx.createGain();
    o.connect(g);g.connect(ctx.destination);
    o.type='sine';o.frequency.value=880;
    g.gain.setValueAtTime(0.15,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.3);
    o.start();o.stop(ctx.currentTime+0.3);
  }catch(e){toast('⚠️ غير مدعوم','error');}
}

    document.body.appendChild(s);
    toast('✅ تم تطبيق JS','success');
  }catch(e){toast('❌ خطأ: '+e.message,'error');}
}

/* ══════════ دالة تحديث ملخص الدين ══════════ */
function updateDebtSummary(){
  const amount = Number($('#df_amount')?.value) || 0;
  const monthly = Number($('#df_monthly')?.value) || 0;
  const paid = Number($('#df_paid')?.value) || 0;
  const remaining = Math.max(0, amount - paid);

  const heroRemaining = $('#debt_hero_remaining');
  if(heroRemaining) heroRemaining.textContent = money0(remaining);

  const sumTotal = $('#debt_sum_total'); if(sumTotal) sumTotal.textContent = money0(amount);
  const sumMonthly = $('#debt_sum_monthly'); if(sumMonthly) sumMonthly.textContent = money0(monthly);
  const sumPaid = $('#debt_sum_paid'); if(sumPaid) sumPaid.textContent = money0(paid);
  const sumRemaining = $('#debt_sum_remaining'); if(sumRemaining) sumRemaining.textContent = money0(remaining);

  const sumMonths = $('#debt_sum_months');
  if(sumMonths){
    if(monthly > 0 && remaining > 0){
      sumMonths.textContent = Math.ceil(remaining / monthly) + ' شهر';
    } else if(remaining === 0 && amount > 0){
      sumMonths.textContent = 'مسدَّد بالكامل ✅';
    } else {
      sumMonths.textContent = '—';
    }
  }

  // تنبيه ذكي
  const alertBox = $('#debt_alert_box');
  if(alertBox){
    if(amount > 0){
      if(paid > amount){
        alertBox.innerHTML = `<div class="debt-alert danger">⚠️ المدفوع (${money0(paid)}) أكبر من الإجمالي (${money0(amount)}).</div>`;
      } else if(monthly > 0 && monthly > amount){
        alertBox.innerHTML = `<div class="debt-alert warn">⚠️ القسط الشهري أكبر من الإجمالي — تحقق من الأرقام.</div>`;
      } else if(monthly > 0 && remaining > 0){
        const months = Math.ceil(remaining / monthly);
        alertBox.innerHTML = `<div class="debt-alert info">ℹ️ سيُسدَّد الدين على ${months} شهر بقسط ${money0(monthly)} شهرياً.</div>`;
      } else if(remaining === 0){
        alertBox.innerHTML = `<div class="debt-alert ok">✅ الدين مسدَّد بالكامل.</div>`;
      } else {
        alertBox.innerHTML = `<div class="debt-alert info">ℹ️ المتبقي ${money0(remaining)} — يمكن تحديد قسط شهري لخطة سداد منظمة.</div>`;
      }
    } else {
      alertBox.innerHTML = '';
    }
  }
}

function genContractNo(){
  const year = new Date().getFullYear();
  let maxNum = 0;
  state.contracts.forEach(c=>{
    const m = (c.contractNo||'').match(/CNT-(\d+)/);
    if(m) maxNum = Math.max(maxNum, Number(m[1]));
  });
  return 'CNT-' + String(maxNum + 83715 + 1).padStart(6,'0');
}

function onContractFilePick(ev){
  const f = ev.target.files[0];
  if(!f) return;
  const maxSize = 20*1024*1024;
  const allowedExt = /\.(pdf|jpe?g|png|docx?|xlsx?)$/i;
  if(f.size > maxSize){ toast('⚠️ الحجم يتجاوز 20MB','error'); ev.target.value=''; return; }
  if(!allowedExt.test(f.name)){ toast('⚠️ صيغة غير مدعومة','error'); ev.target.value=''; return; }
  const label = $('#cf_file_label');
  if(label){
    const sizeKB = (f.size/1024).toFixed(1);
    label.textContent = `📎 ${f.name} (${sizeKB} KB)`;
    label.style.color = '#16a34a';
  }
  toast('✅ الملف جاهز','success');
}

function updateDocSummary(){
  const typeEl = $('#edf_type');
  const expiryEl = $('#edf_expiry');
  const summaryType = $('#docSummaryType');
  const summaryExpiry = $('#docSummaryExpiry');

  if(typeEl && summaryType) summaryType.textContent = typeEl.value;
  if(expiryEl && summaryExpiry){
    if(expiryEl.value){
      const days = daysUntil(expiryEl.value);
      if(days < 0){
        summaryExpiry.textContent = `منتهية منذ ${Math.abs(days)} يوم`;
        summaryExpiry.style.color = '#dc2626';
      } else if(days <= 30){
        summaryExpiry.textContent = `تنتهي خلال ${days} يوم`;

function validateDocFile(ev){
  const f = ev.target.files[0];
  if(!f) return;
  const maxSize = 5*1024*1024;
  const allowedExt = /\.(pdf|jpe?g|png|webp)$/i;
  const allowedMime = ['application/pdf','image/jpeg','image/jpg','image/png','image/webp'];
  if(f.size > maxSize){ toast('⚠️ الحجم يتجاوز 5MB','error'); ev.target.value=''; return; }
  if(!allowedMime.includes(f.type) && !f.name.match(allowedExt)){
    toast('⚠️ صيغة غير مدعومة','error'); ev.target.value=''; return;
  }
  toast('✅ الملف جاهز للرفع','success');
}

      <button class="btn" style="background:#fbbf24;color:#78350f;font-weight:800;padding:11px 20px" onclick="openBranchForm()">➕ إضافة فرع جديد</button>
      <button class="btn" style="background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3);padding:11px 20px" onclick="go('employees')">👥 العودة إلى الموظفين</button>
    </div>
  </div>

  <!-- ═══ 4 بطاقات إحصائية ═══ -->
  <div class="stats" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr))">
    ${statCard('إجمالي الفروع',total,'🏬','blue')}
    ${statCard('فروع نشطة',active,'✅','green')}
    ${statCard('موظفون مرتبطون',linkedEmp,'👤','purple')}
    ${statCard('فروع غير نشطة',inactive,'⏸️','yellow')}
  </div>

  <!-- ═══ الجدول ═══ -->
  <div class="card">
    <div class="card-head" style="flex-wrap:wrap;gap:8px;background:#f8fafc">
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <button class="btn primary sm" onclick="go('branches')">الفروع</button>
        <button class="btn ghost sm" onclick="go('employees')">الموظفون</button>
      </div>
      <div style="margin-inline-start:auto;display:flex;gap:6px;flex-wrap:wrap">
        <button class="btn primary sm" onclick="openBranchForm()">➕ إضافة فرع جديد</button>
      </div>
    </div>
    <div class="card-body" style="padding:14px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px">
        <strong style="font-size:14px">بحث سريع</strong>
      </div>
      <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap">
        <input class="search" id="branchSearch" placeholder="اسم الفرع أو الكود أو الموقع أو الوصف" oninput="branchFilters.q=this.value;renderBranchesTable()" style="flex:1;min-width:200px" value="${esc(branchFilters.q)}">
        <button class="btn primary sm" onclick="renderBranchesTable()">🔍 بحث</button>
        <button class="btn ghost sm" onclick="branchFilters={q:''};go('branches')">↺ إعادة ضبط</button>
      </div>

      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px;background:#f1f5f9;border-radius:10px;margin-bottom:12px">
        <span class="muted small">الموظفون المرتبطون: <strong id="branchLinkedCount">0</strong></span>
        <span class="muted small">النتائج الحالية: <strong id="branchCount">0</strong></span>
        <span class="muted small" style="margin-inline-start:auto">فروع فعّالة: <strong id="branchActiveCount">0</strong></span>
      </div>

      <div class="table-wrap">
        <table style="min-width:1100px">
          <thead><tr>
            <th style="width:50px">#</th>
            <th>اسم الفرع</th>
            <th>الكود</th>
            <th>الموقع</th>
            <th>المسؤول</th>
            <th style="text-align:center">الحالة</th>
            <th style="text-align:center">عدد الموظفين</th>
            <th style="text-align:center">الإنذارات والتنبيهات</th>
            <th style="text-align:center">الإجراءات</th>
          </tr></thead>
          <tbody id="branchBody"></tbody>
        </table>
      </div>
    </div>
  </div>`;
};

function renderBranchesTable(){
  const body=$('#branchBody');if(!body)return;
  const q=(branchFilters.q||'').trim().toLowerCase();
  let list=state.branches.slice();
  if(q)list=list.filter(b=>
    (b.name||'').toLowerCase().includes(q)||
    (b.code||'').toLowerCase().includes(q)||
    (b.location||'').toLowerCase().includes(q)||
    (b.description||'').toLowerCase().includes(q)
  );

  const totalEmpLinked=state.employees.filter(e=>e.branchId || e.branch).length;
  const activeCount=state.branches.filter(b=>b.status==='نشط').length;
  const el1=$('#branchLinkedCount');if(el1)el1.textContent=totalEmpLinked;
  const el2=$('#branchCount');if(el2)el2.textContent=list.length;
  const el3=$('#branchActiveCount');if(el3)el3.textContent=activeCount;

  if(!list.length){body.innerHTML=`<tr><td colspan="9" class="empty">لا فروع مطابقة</td></tr>`;return;}

  body.innerHTML=list.map(b=>{
    const empCount=state.employees.filter(e => e.branchId===b.id || e.branch===b.name).length;
    const idx=state.branches.indexOf(b)+1;
    const alerts=[];
    if(b.leaseEnd){
      const days=daysUntil(b.leaseEnd);
      if(days>=0&&days<=30)alerts.push('⏰ عقد الإيجار ينتهي بعد '+days+' يوم');
      else if(days<0)alerts.push('❌ عقد الإيجار منتهي');
    }
    if(!b.commercialReg)alerts.push('⚠️ لا يوجد سجل تجاري');
    if(!b.taxNumber)alerts.push('⚠️ لا يوجد رقم ضريبي');

    return `<tr>
      <td>
        <div style="width:32px;height:32px;border-radius:10px;background:#e0e7ff;color:#4338ca;display:grid;place-items:center;font-weight:800;font-size:13px">${idx}</div>
      </td>
      <td><strong style="font-size:13.5px">${esc(b.name)}</strong></td>
      <td><span style="font-family:monospace;font-size:11.5px;background:#f1f5f9;padding:4px 8px;border-radius:6px">${esc(b.code||'—')}</span></td>
      <td>${esc(b.location||'—')}</td>
      <td>${b.manager?esc(b.manager):'—'}</td>
      <td style="text-align:center">
        <span class="badge ${b.status==='نشط'?'green':'gray'}">${esc(b.status||'نشط')}</span>
      </td>
      <td style="text-align:center">
        <span class="badge ${empCount>0?'blue':'gray'}" style="font-size:12px;padding:5px 12px">${empCount}</span>
      </td>
      <td style="text-align:center">
        ${alerts.length?`<span style="font-size:11px;color:#d97706;cursor:help" title="${esc(alerts.join('\n'))}">⚠️ ${alerts.length}</span>`:'—'}
      </td>
      <td>
        <div class="row-actions" style="justify-content:center">
          <button class="btn sm ghost" onclick="openBranchForm('${b.id}')">✏️ تعديل</button>
          <button class="btn sm danger" onclick="deleteBranch('${b.id}')">🗑️ حذف</button>
        </div>
      </td>
    </tr>`;
  }).join('');
}

function openBranchForm(id){
  const b=id?state.branches.find(x=>x.id===id):null;
  const isNew=!id;
  const nextCode=b?.code||genBranchCode();

  openModal(id?'✏️ تعديل الفرع':'➕ إضافة فرع جديد', `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px">
      <div style="font-size:17px;font-weight:800">${id?'تعديل الفرع':'إضافة فرع جديد'}</div>
      <button class="btn ghost sm" onclick="closeModal();go('branches')">📋 عرض الفروع</button>
    </div>

    <div class="grid2">
      <div class="field">
        <label>اسم الفرع <span style="color:var(--red)">*</span></label>
        <input id="bf_name" value="${esc(b?.name||'')}" placeholder="مثال: الفرع الرئيسي" autofocus>
      </div>
      <div class="field">
        <label>كود الفرع</label>
        <input id="bf_code" value="${esc(nextCode)}" placeholder="مثال: HQ" maxlength="10" dir="ltr">
      </div>
      <div class="field">
        <label>الموقع</label>
        <input id="bf_location" value="${esc(b?.location||'')}" placeholder="مثال: الرياض">
      </div>
      <div class="field">
        <label>المسؤول عن الفرع</label>
        <input id="bf_manager" value="${esc(b?.manager||'')}" placeholder="اسم المشرف أو المدير">
      </div>
      <div class="field">
        <label>الحالة</label>
        <select id="bf_status">
          <option value="نشط" ${b?.status==='نشط'||isNew?'selected':''}>نشط</option>
          <option value="غير نشط" ${b?.status==='غير نشط'?'selected':''}>غير نشط</option>
          <option value="قيد الإنشاء" ${b?.status==='قيد الإنشاء'?'selected':''}>قيد الإنشاء</option>
        </select>
      </div>
      <div class="field">
        <label>&nbsp;</label>
        <div class="muted small" style="padding:10px 0">معلومات الاتصال سيتم إضافتها لاحقًا</div>
      </div>
    </div>

    <div class="field">
      <label>وصف الفرع</label>
      <textarea id="bf_desc" rows="3" placeholder="اكتب وصفًا مختصرًا للفرع ومسؤوليته">${esc(b?.description||'')}</textarea>
    </div>

    <div style="background:#eef2ff;border:1px solid #c7d2fe;border-radius:10px;padding:12px;margin:14px 0 12px">
      <div style="font-weight:800;color:#3730a3;margin-bottom:8px">📋 معلومات الرخص والعقود الإدارية</div>
    </div>

    <div class="grid2">
      <div class="field">
        <label>رقم السجل التجاري</label>
        <input id="bf_cr" value="${esc(b?.commercialReg||'')}" placeholder="مثال: 1010234567" dir="ltr">
      </div>
      <div class="field">
        <label>الرقم الضريبي</label>
        <input id="bf_tax" value="${esc(b?.taxNumber||'')}" placeholder="مثال: 700/12345" dir="ltr">
      </div>
      <div class="field">
        <label>رقم رخصة النفايات</label>
        <input id="bf_waste" value="${esc(b?.wasteLicense||b?.oilLicense||'')}" placeholder="مثال: WST-554321" dir="ltr">
      </div>
      <div class="field">
        <label>رقم رخصة البلدية</label>
        <input id="bf_municipal" value="${esc(b?.municipalLicense||'')}" placeholder="مثال: BL-2026-88123" dir="ltr">
      </div>
      <div class="field">
        <label>تاريخ بداية عقد الإيجار</label>
        <input id="bf_lease_start" type="date" value="${esc(b?.leaseStart||'')}">
      </div>
      <div class="field">
        <label>تاريخ نهاية عقد الإيجار</label>
        <input id="bf_lease_end" type="date" value="${esc(b?.leaseEnd||'')}">
      </div>
      <div class="field">
        <label>سعر عقد الإيجار (ريال)</label>
        <input id="bf_lease_price" type="number" value="${b?.leasePrice??0}" placeholder="0.00">
      </div>
    </div>

    <div class="form-note" style="background:#fef3c7;border-color:#d97706;color:#b45309;font-size:12px">
      🔔 سيظهر تنبيه قبل 30 يوم من انتهاء عقد الإيجار في مركز التنبيهات.
    </div>
  `, ()=>{
    const name=$('#bf_name').value.trim();
    if(!name){toast('⚠️ اكتب اسم الفرع','error');return false;}
    const data={
      name,
      code:$('#bf_code').value.trim().toUpperCase()||genBranchCode(),
      location:$('#bf_location').value.trim(),
      manager:$('#bf_manager').value.trim(),
      status:$('#bf_status').value,
      description:$('#bf_desc').value.trim(),
      commercialReg:$('#bf_cr').value.trim(),
      taxNumber:$('#bf_tax').value.trim(),
      wasteLicense:$('#bf_waste').value.trim(),
      municipalLicense:$('#bf_municipal').value.trim(),
      leaseStart:$('#bf_lease_start').value,
      leaseEnd:$('#bf_lease_end').value,
      leasePrice:Number($('#bf_lease_price').value)||0
    };
    if(b){
      Object.assign(b,data);
      logAction('تعديل فرع','الفروع',name);
    }else{
      state.branches.push({id:uid(),...data});
      logAction('إضافة فرع','الفروع',name);
    }
    save();closeModal();renderBranchesTable();buildNav();renderNotifs();
    toast(id?'✅ تم التعديل':'✅ تم إضافة الفرع','success');
    return true;
  },{
    wide:true,
    footerHTML:`
      <button type="button" class="btn ghost" onclick="closeModal()">إلغاء</button>
      <button type="button" class="btn primary" onclick="submitModal()">💾 حفظ الفرع</button>`
  });
}

function deleteBranch(id){
  const b=state.branches.find(x=>x.id===id);if(!b)return;
  const empCount=state.employees.filter(e=>e.branchId===id || e.branch===b.name).length;
  if(empCount>0){toast('⚠️ لا يمكن حذف فرع فيه '+empCount+' موظف','error');return;}
  if(!confirm('حذف فرع "'+b.name+'"؟'))return;
  state.branches=state.branches.filter(x=>x.id!==id);
  save();renderBranchesTable();buildNav();
  toast('🗑️ تم الحذف','success');
}

  const had=load();
  if(!had||!state.users?.length||!state.employees?.length)seed();
// تحويل البيانات القديمة من oilLicense إلى wasteLicense
if(state.branches && state.branches.length){
  state.branches.forEach(b=>{
    if(b.oilLicense && !b.wasteLicense){
      b.wasteLicense=b.oilLicense;
      delete b.oilLicense;
    }
  });
}
  if(!state.permissions||!Object.keys(state.permissions).length)state.permissions=defaultPerms();

  (state.departments||[]).forEach(d=>{d.managerId=null;});
  (state.employees||[]).forEach(e=>{e.managerId=null;});
  ['admin','manager'].forEach(r=>{if(state.permissions[r]&&!state.permissions[r].monthlyAttendance)state.permissions[r].monthlyAttendance={read:true,write:true,approve:true};});

 updateLangBtn();

  setInterval(()=>{try{renderNotifs();}catch(e){}},60000);

function loadSession2(){try{session=JSON.parse(localStorage.getItem(SESSION_KEY)||'null');}catch(e){session=null;}}
</script>
