*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f1f5f9;--card:#fff;--text:#0f172a;--muted:#64748b;--border:#e2e8f0;--primary:#4f46e5;--primary-d:#4338ca;--primary-l:#eef2ff;--green:#16a34a;--red:#dc2626;--yellow:#d97706;--purple:#7c3aed;--teal:#0f766e;--orange:#c2410c;--gray:#475569;--blue:#2563eb;--sidebar:#0f172a;--sidebar-h:#1e293b;--sidebar-t:#cbd5e1;--shadow:0 12px 24px -14px rgba(15,23,42,.28)}
body.dark{--bg:#0b1220;--card:#1e293b;--text:#e2e8f0;--muted:#94a3b8;--border:#334155;--primary-l:#1e293b;--sidebar:#020617;--sidebar-h:#1e293b;--shadow:0 12px 24px -14px rgba(0,0,0,.6)}
body{font-family:'Tajawal',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;color:inherit}
code{background:var(--primary-l);color:var(--primary);padding:2px 7px;border-radius:6px;font-family:monospace;font-size:13px;direction:ltr;display:inline-block}

.login-wordmark{display:block;width:100%;max-width:340px;height:auto;margin:0 auto}
.login-box h1{text-align:center;margin-bottom:26px}
.login-box>p{text-align:center;color:#2e5a77;font-size:15px;font-weight:700;margin-bottom:24px}
.login-box .field label{color:#2e5a77}
.login-box input{background:#fff;color:#0f172a;border-color:#c5d8e4}
.login-box input:focus{outline:none;border-color:#2276a2;box-shadow:0 0 0 3px rgba(34,118,162,.18)}
.login-box .btn.primary{background:#2276a2;border-color:#2276a2}
.login-box .btn.primary:hover{background:#2e5a77}
.login-hint{margin-top:22px;padding:16px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;font-size:13px;color:#475569;line-height:1.9}
.login-hint strong{color:#0f172a;display:block;margin-bottom:6px}
.login-hint p{margin:0}
.app{display:flex;min-height:100vh}

.brand-title{color:#fff;font-weight:700;font-size:15px}
.brand-sub{font-size:11px;color:#94a3b8;margin-top:2px}
.nav{padding:10px;display:flex;flex-direction:column;gap:2px;flex:1;overflow-y:auto}
.nav::-webkit-scrollbar{width:4px}
.nav::-webkit-scrollbar-thumb{background:#334155;border-radius:4px}
.nav-section{padding:12px 14px 4px;font-size:10.5px;color:#64748b;font-weight:800}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 14px;border-radius:10px;color:var(--sidebar-t);font-size:13.5px;font-weight:500;text-align:right;width:100%}
.nav-item:hover{background:var(--sidebar-h);color:#fff}
.nav-item.active{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;font-weight:700}
.nav-item .badge-mini{margin-inline-start:auto;background:#dc2626;color:#fff;font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px;min-width:20px;text-align:center}
.sidebar-foot{padding:12px;border-top:1px solid rgba(255,255,255,.08)}
.user-chip{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:11px;background:var(--sidebar-h)}
.user-avatar{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#6366f1,#8b5cf6);display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px;flex:none}
.user-name{color:#fff;font-size:13px;font-weight:700;line-height:1.2}
.user-role{font-size:11px;color:#94a3b8;margin-top:2px}
.logout-btn{margin-inline-start:auto;color:#94a3b8;font-size:18px;padding:6px 8px;border-radius:8px}
.main{flex:1;margin-right:255px;padding:0 22px 60px;min-width:0}
.topbar{display:flex;align-items:center;gap:14px;padding:16px 0;position:sticky;top:0;z-index:40;background:linear-gradient(var(--bg) 75%,transparent)}
.hamburger{display:inline-flex;font-size:22px;padding:6px 10px;border-radius:10px;background:var(--card);border:1px solid var(--border);align-items:center;justify-content:center;transition:.2s}
.hamburger:hover{background:var(--primary-l);border-color:var(--primary);color:var(--primary)}
.topbar-title{font-weight:800;font-size:17px}
.topbar-actions{margin-inline-start:auto;display:flex;gap:8px;align-items:center}
.icon-btn{width:38px;height:38px;border-radius:11px;background:var(--card);border:1px solid var(--border);display:grid;place-items:center;font-size:16px;position:relative}
.icon-btn:hover{background:var(--primary-l);border-color:var(--primary);color:var(--primary)}
.notif-count{position:absolute;top:-6px;left:-6px;background:#dc2626;color:#fff;font-size:10.5px;font-weight:800;padding:2px 6px;border-radius:99px;min-width:20px;text-align:center;border:2px solid var(--card)}
.view-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.view-head h2{font-size:20px;font-weight:800}
.view-head .actions{margin-inline-start:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}.small{font-size:12px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.card-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border)}
.card-head h3{font-size:15px;font-weight:700}
.card-head .btn{margin-inline-start:auto}
.card-body{padding:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;display:flex;align-items:center;gap:12px}
.stat .ico{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;font-size:18px;flex:none}
.stat .label{font-size:12px;color:var(--muted);margin-bottom:3px}
.stat .value{font-size:19px;font-weight:800;line-height:1.2}
.ico.blue{background:#e0e7ff;color:#4338ca}.ico.green{background:#dcfce7;color:#15803d}.ico.purple{background:#ede9fe;color:#6d28d9}.ico.yellow{background:#fef3c7;color:#b45309}.ico.red{background:#fee2e2;color:#b91c1c}.ico.gray{background:#e2e8f0;color:#475569}.ico.pink{background:#fce7f3;color:#be185d}.ico.teal{background:#ccfbf1;color:#0f766e}.ico.orange{background:#fed7aa;color:#c2410c}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.three-col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.chart-wrap{position:relative;height:260px;padding:12px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:560px}
thead th{background:var(--bg);text-align:right;padding:11px 12px;font-size:12px;font-weight:700;color:var(--muted);border-bottom:1px solid var(--border);white-space:nowrap}
tbody td{padding:11px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--bg)}
.empty{text-align:center;color:var(--muted);padding:30px!important;font-size:14px}
.row-actions{display:flex;gap:5px;flex-wrap:wrap}
.badge{display:inline-block;padding:4px 10px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap}
.badge.green{background:#dcfce7;color:#15803d}.badge.red{background:#fee2e2;color:#b91c1c}.badge.yellow{background:#fef3c7;color:#b45309}.badge.blue{background:#dbeafe;color:#1d4ed8}.badge.gray{background:#e2e8f0;color:#475569}.badge.purple{background:#ede9fe;color:#6d28d9}.badge.pink{background:#fce7f3;color:#be185d}.badge.orange{background:#fed7aa;color:#c2410c}.badge.teal{background:#ccfbf1;color:#0f766e}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 15px;border-radius:10px;font-size:13.5px;font-weight:600;white-space:nowrap;text-decoration:none;transition:.16s}
.btn.primary{background:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-d)}
.btn.ghost{background:var(--card);border:1px solid var(--border);color:var(--text)}
.btn.ghost:hover{background:var(--primary-l);border-color:var(--primary);color:var(--primary)}
.btn.danger{background:#fee2e2;color:#b91c1c}.btn.danger:hover{background:#fecaca}
.btn.success{background:#dcfce7;color:#15803d}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn.full{width:100%}
.search{padding:9px 13px;border:1px solid var(--border);border-radius:10px;font-size:13.5px;background:var(--card);min-width:200px}
input[type=date],input[type=month],input[type=time]{padding:8px 12px;border:1px solid var(--border);border-radius:10px;font-size:13.5px;background:var(--card)}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:12.5px;font-weight:700;opacity:.85}
.field input,.field select,.field textarea{padding:10px 12px;border:1px solid var(--border);border-radius:10px;font-size:13.5px;background:var(--card);width:100%}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(79,70,229,.13)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 12px}
.form-note{background:var(--primary-l);border:1px solid rgba(79,70,229,.25);color:var(--primary);padding:10px 13px;border-radius:10px;font-size:12.5px;margin-bottom:14px;line-height:1.7;display:flex;align-items:center;gap:8px}
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:1000;padding:18px}
.overlay.open{display:flex;animation:fade .18s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:var(--card);border-radius:18px;width:100%;max-width:680px;max-height:92vh;display:flex;flex-direction:column;animation:pop .22s;overflow:hidden}
.modal.wide{max-width:900px}
@keyframes pop{from{transform:scale(.95) translateY(14px);opacity:0}to{transform:none;opacity:1}}
.modal-head{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border)}
.modal-head h3{font-size:16px;font-weight:800}
.close-x{margin-inline-start:auto;font-size:22px;color:var(--muted);padding:0 6px;border-radius:8px}
.close-x:hover{color:#dc2626;background:#fee2e2}
.modal-body{padding:18px 20px;overflow:auto;flex:1}
.modal-foot{display:flex;gap:10px;padding:12px 20px;border-top:1px solid var(--border);background:var(--bg)}
.modal-foot .btn{flex:1}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:14px;overflow-x:auto}
.tab{padding:9px 15px;font-size:13px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tab.active{color:var(--primary);border-bottom-color:var(--primary)}
.toast{position:fixed;bottom:24px;right:24px;background:#0f172a;color:#fff;padding:12px 20px;border-radius:12px;font-size:13.5px;font-weight:600;z-index:1500;opacity:0;transform:translateY(18px);transition:.28s;box-shadow:0 14px 32px -12px rgba(0,0,0,.5)}
.toast.show{opacity:1;transform:none}
.toast.success{background:#16a34a}.toast.error{background:#dc2626}
.profile-header{display:flex;gap:18px;align-items:center;padding:22px;background:linear-gradient(135deg,var(--primary),var(--purple));border-radius:14px;color:#fff;margin-bottom:18px;flex-wrap:wrap}
.profile-avatar{width:80px;height:80px;border-radius:20px;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:32px;font-weight:800;flex:none;border:2px solid rgba(255,255,255,.3)}
.profile-info h2{font-size:20px;font-weight:800;margin-bottom:6px}
.profile-info .meta{font-size:12.5px;opacity:.9;display:flex;flex-wrap:wrap;gap:12px}
.switch{position:relative;display:inline-block;width:42px;height:23px}
.switch input{display:none}
.slider{position:absolute;inset:0;background:#cbd5e1;border-radius:24px;transition:.3s;cursor:pointer}
.slider:before{content:"";position:absolute;height:17px;width:17px;right:3px;top:3px;background:#fff;border-radius:50%;transition:.3s}
.switch input:checked+.slider{background:var(--primary)}
.switch input:checked+.slider:before{transform:translateX(-19px)}
.kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.kanban-col{background:var(--bg);border-radius:12px;padding:10px;min-height:180px}
.kanban-col h4{font-size:12.5px;font-weight:800;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.kanban-col h4 .count{margin-inline-start:auto;background:var(--card);padding:2px 8px;border-radius:99px;font-size:11px;color:var(--muted)}
.k-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:6px}
.chat-layout{display:grid;grid-template-columns:280px 1fr;background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;height:calc(100vh - 160px);min-height:500px}
.chat-channels{border-inline-start:1px solid var(--border);display:flex;flex-direction:column;background:var(--bg)}
.chat-channels-head{padding:12px;border-bottom:1px solid var(--border);display:flex;gap:8px}
.chat-search{padding:7px 11px;border:1px solid var(--border);border-radius:9px;background:var(--card);font-size:13px;flex:1;min-width:0}
.chat-channels-list{flex:1;overflow-y:auto;padding:8px}
.chat-ch{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:10px;cursor:pointer;margin-bottom:2px}
.chat-ch:hover{background:var(--card)}
.chat-ch.active{background:var(--primary);color:#fff}
.chat-ch-avatar{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#6366f1,#8b5cf6);display:grid;place-items:center;color:#fff;font-weight:800;flex:none;font-size:13px}
.chat-ch-info{flex:1;min-width:0}
.chat-ch-name{font-weight:700;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-ch-meta{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.chat-ch-badge{background:#dc2626;color:#fff;font-size:10.5px;font-weight:800;padding:2px 6px;border-radius:99px}
.chat-main{display:flex;flex-direction:column;background:var(--bg);min-width:0}
.chat-main-head{padding:10px 14px;border-bottom:1px solid var(--border);background:var(--card)}
.chat-main-head h3{font-size:14.5px;font-weight:800}
.chat-msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.chat-msg{display:flex;gap:9px;max-width:78%}
.chat-msg.mine{align-self:flex-end;flex-direction:row-reverse}
.chat-msg-avatar{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#6366f1,#8b5cf6);display:grid;place-items:center;color:#fff;font-weight:800;font-size:12px;flex:none;align-self:flex-end}
.chat-msg-body{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:8px 12px;min-width:70px}
.chat-msg.mine .chat-msg-body{background:var(--primary);color:#fff;border-color:var(--primary)}
.chat-msg-name{font-size:11.5px;font-weight:700;margin-bottom:3px;color:var(--primary)}
.chat-msg.mine .chat-msg-name{display:none}
.chat-msg-text{font-size:13px;line-height:1.6;word-break:break-word;white-space:pre-wrap}
.chat-msg-time{font-size:10px;color:var(--muted);margin-top:3px}
.chat-input{padding:10px;border-top:1px solid var(--border);background:var(--card);display:flex;gap:8px}
.chat-input textarea{flex:1;resize:none;padding:10px 13px;border:1px solid var(--border);border-radius:11px;background:var(--bg);font-size:13.5px;min-height:42px;max-height:100px}
.chat-send-btn{width:42px;height:42px;border-radius:11px;background:var(--primary);color:#fff;display:grid;place-items:center;font-size:16px;flex:none}
.chat-empty{flex:1;display:grid;place-items:center;color:var(--muted);text-align:center;padding:40px}
.course-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.course-card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:.2s}
.course-card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--primary)}
.course-cover{height:100px;display:grid;place-items:center;font-size:38px;color:#fff}
.course-body{padding:14px;flex:1;display:flex;flex-direction:column}
.course-title{font-weight:800;font-size:14px;margin-bottom:5px}
.course-meta{font-size:11.5px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.course-progress{height:6px;background:var(--bg);border-radius:99px;overflow:hidden;margin-top:auto}
.course-progress-fill{height:100%;background:linear-gradient(90deg,#4f46e5,#8b5cf6)}
.lesson-item{display:flex;align-items:center;gap:12px;padding:11px 13px;background:var(--bg);border-radius:10px;margin-bottom:8px;cursor:pointer}
.lesson-num{width:30px;height:30px;border-radius:8px;background:var(--card);display:grid;place-items:center;font-weight:800;font-size:12px;flex:none}
.lesson-title{font-weight:600;font-size:13px;flex:1}
.quiz-question{background:var(--bg);border-radius:11px;padding:14px;margin-bottom:12px}
.quiz-question-text{font-weight:700;font-size:14px;margin-bottom:10px;line-height:1.5}
.quiz-option{display:flex;align-items:center;gap:10px;padding:10px 13px;border:1px solid var(--border);border-radius:10px;margin-bottom:7px;cursor:pointer;background:var(--card)}
.quiz-option.selected{border-color:var(--primary);background:var(--primary-l);font-weight:700}
.cert-preview{background:#fff;color:#0f172a;padding:40px 30px;border-radius:8px;max-width:750px;margin:0 auto;text-align:center;direction:rtl;position:relative;border:12px double #4f46e5}
.cert-preview h1{font-size:26px;color:#4f46e5;margin:14px 0;border-bottom:2px solid #e2e8f0;padding-bottom:12px}
.cert-preview .course{font-size:20px;font-weight:800;margin:14px 0}
.cert-preview .seal{position:absolute;bottom:26px;left:40px;width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;display:grid;place-items:center;font-size:10.5px;font-weight:800;border:4px solid #fff;box-shadow:0 0 0 3px #4f46e5;transform:rotate(-15deg)}
.assist-fab{position:fixed;bottom:24px;left:24px;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;display:grid;place-items:center;font-size:26px;box-shadow:0 12px 32px -6px rgba(79,70,229,.6);cursor:pointer;z-index:900;border:3px solid var(--card)}
.assist-panel{position:fixed;bottom:92px;left:24px;width:400px;max-width:calc(100vw - 40px);height:600px;max-height:calc(100vh - 130px);background:var(--card);border:1px solid var(--border);border-radius:18px;box-shadow:0 24px 60px -12px rgba(0,0,0,.5);display:none;flex-direction:column;z-index:901;overflow:hidden}
.assist-panel.open{display:flex}
.assist-head{padding:14px 16px;background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;display:flex;align-items:center;gap:10px;flex:none}
.assist-head-avatar{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:20px;border:2px solid rgba(255,255,255,.3)}
.assist-head-info{flex:1}
.assist-head-info h3{font-size:14px;font-weight:800}
.assist-head-info p{font-size:11px;opacity:.85}
.assist-head button{width:30px;height:30px;border-radius:8px;background:rgba(255,255,255,.15);color:#fff;font-size:14px}
.assist-body{flex:1;overflow-y:auto;padding:14px;background:var(--bg);display:flex;flex-direction:column;gap:10px}
.assist-msg{display:flex;gap:9px;max-width:90%}
.assist-msg.user{align-self:flex-end;flex-direction:row-reverse}
.assist-msg-avatar{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;display:grid;place-items:center;font-size:15px;flex:none}
.assist-msg.user .assist-msg-avatar{background:linear-gradient(135deg,#16a34a,#4ade80)}
.assist-msg-body{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 13px;font-size:13px;line-height:1.7;word-break:break-word}
.assist-msg.user .assist-msg-body{background:var(--primary);color:#fff;border-color:var(--primary)}
.assist-msg-body strong{color:var(--primary)}
.assist-msg.user .assist-msg-body strong{color:#fff}
.assist-msg-body .stat-line{display:flex;justify-content:space-between;gap:12px;padding:3px 0;border-bottom:1px solid var(--border)}
.assist-quick{padding:9px 12px;background:var(--card);border-top:1px solid var(--border);display:flex;gap:6px;overflow-x:auto;flex:none}
.assist-qbtn{padding:6px 12px;border-radius:99px;background:var(--bg);border:1px solid var(--border);font-size:12px;font-weight:600;white-space:nowrap;cursor:pointer}
.assist-input{padding:10px 12px;border-top:1px solid var(--border);background:var(--card);display:flex;gap:8px;flex:none}
.assist-input textarea{flex:1;resize:none;padding:10px 13px;border:1px solid var(--border);border-radius:11px;background:var(--bg);font-size:13.5px;min-height:42px;max-height:90px}
.assist-send{width:42px;height:42px;border-radius:11px;background:var(--primary);color:#fff;display:grid;place-items:center;font-size:16px;flex:none}
.notif-panel{position:fixed;top:68px;left:16px;width:360px;max-width:calc(100vw - 20px);max-height:min(500px,calc(100vh - 90px));background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:0 20px 40px -12px rgba(0,0,0,.45);overflow:hidden;display:none;z-index:999}
.notif-panel.open{display:flex;flex-direction:column}
.notif-head{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center}
.notif-head h4{font-size:14.5px;font-weight:800}
.notif-head .muted{margin-inline-start:auto;font-size:12px}
.notif-list{overflow-y:auto;flex:1}
.notif-item{display:flex;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border);cursor:pointer;align-items:flex-start}
.notif-item:hover{background:var(--bg)}
.notif-item .n-ico{width:34px;height:34px;border-radius:9px;flex:none;display:grid;place-items:center;font-size:15px}
.notif-item .n-title{font-size:13px;font-weight:700;margin-bottom:2px}
.notif-item .n-desc{font-size:11.5px;color:var(--muted);line-height:1.5}
.notif-empty{padding:34px;text-align:center;color:var(--muted)}
.notif-footer{padding:9px;border-top:1px solid var(--border);text-align:center}
.search-overlay{position:fixed;inset:0;background:rgba(15,23,42,.6);backdrop-filter:blur(4px);display:none;align-items:flex-start;justify-content:center;z-index:1100;padding:70px 18px 18px}
.search-overlay.open{display:flex}
.search-box{background:var(--card);border:1px solid var(--border);border-radius:14px;width:100%;max-width:600px;overflow:hidden}
.search-input-wrap{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--border)}
.search-input-wrap input{flex:1;border:none;background:none;font-size:15px;outline:none;color:var(--text)}
.search-results{max-height:400px;overflow-y:auto;padding:8px}
.sr-item{display:flex;align-items:center;gap:11px;padding:10px 13px;border-radius:10px;cursor:pointer}
.sr-item:hover{background:var(--primary-l)}
.sr-icon{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;background:var(--bg);font-size:14px;flex:none}
.sr-title{font-size:13px;font-weight:700}
.sr-desc{font-size:11.5px;color:var(--muted);margin-top:2px}
.sr-empty{padding:34px;text-align:center;color:var(--muted)}
.sr-section{padding:8px 14px 4px;font-size:11px;color:var(--muted);font-weight:700}
.okr-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px}
.okr-kr{margin-bottom:11px}
.okr-kr-header{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px}
.okr-bar{height:8px;background:var(--bg);border-radius:99px;overflow:hidden}
.okr-bar-fill{height:100%;background:linear-gradient(90deg,#4f46e5,#8b5cf6);border-radius:99px;transition:.4s}
.balance-card{padding:13px;background:var(--bg);border-radius:11px;text-align:center}
.balance-value{font-size:24px;font-weight:800;margin:6px 0}
.balance-bar{height:5px;background:var(--border);border-radius:99px;overflow:hidden;margin-top:8px}
.balance-bar-fill{height:100%;background:var(--primary)}
.geo-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:700}
.geo-badge.inside{background:#dcfce7;color:#15803d}
.geo-badge.outside{background:#fee2e2;color:#b91c1c}
.stars{display:inline-flex;gap:2px;font-size:14px;color:#fbbf24}
.timeline{position:relative;padding-inline-start:24px}
.timeline:before{content:"";position:absolute;right:8px;top:0;bottom:0;width:2px;background:var(--border)}
.t-item{position:relative;margin-bottom:14px}
.t-item:before{content:"";position:absolute;right:-20px;top:4px;width:11px;height:11px;border-radius:50%;background:var(--primary);border:2px solid var(--card)}
.t-item .t-time{font-size:11px;color:var(--muted);margin-bottom:3px}
.t-item .t-title{font-size:13px;font-weight:700;margin-bottom:2px}
.t-item .t-desc{font-size:12px;color:var(--muted);line-height:1.5}
.org-tree{padding:18px 8px;overflow-x:auto;text-align:center}
.org-node{display:inline-block;vertical-align:top;text-align:center;margin:0 8px}
.org-card{background:var(--card);border:2px solid var(--border);border-radius:12px;padding:12px 16px;min-width:160px;display:inline-block;cursor:pointer}
.org-card .oc-avatar{width:42px;height:42px;border-radius:11px;margin:0 auto 7px;background:linear-gradient(135deg,#6366f1,#8b5cf6);display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px}
.org-card .oc-name{font-weight:800;font-size:13px;margin-bottom:3px}
.org-card .oc-role{font-size:11px;color:var(--muted)}
.org-card.dept{border-color:var(--purple)}
.org-children{margin-top:18px;display:flex;justify-content:center;flex-wrap:wrap;gap:9px}
.asset-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.asset-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;display:flex;gap:12px}
.asset-card .a-ico{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;font-size:19px;background:var(--primary-l);flex:none}
.asset-card .a-name{font-weight:800;font-size:13.5px;margin-bottom:3px}
.asset-card .a-meta{font-size:11.5px;color:var(--muted);line-height:1.6}
.letter-preview{background:#fff;color:#0f172a;padding:36px;border-radius:8px;line-height:2;font-size:14.5px;max-width:780px;margin:0 auto;direction:rtl}
.letter-preview h1{text-align:center;font-size:20px;margin-bottom:22px;color:#4f46e5;border-bottom:2px solid #4f46e5;padding-bottom:12px}
.shift-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.shift-cell{background:var(--card);border:1px solid var(--border);border-radius:10px;min-height:84px;padding:6px;font-size:11px}
.shift-cell.today{border-color:var(--primary);background:var(--primary-l)}
.shift-chip{display:block;padding:3px 6px;border-radius:6px;font-size:10.5px;margin-bottom:2px;font-weight:600}
.shift-chip.morning{background:#fef3c7;color:#b45309}
.shift-chip.evening{background:#dbeafe;color:#1d4ed8}
.perm-check{width:19px;height:19px;accent-color:var(--primary);cursor:pointer}
@media(max-width:1100px){.kanban{grid-template-columns:repeat(2,1fr)}}
@media(max-width:900px){
.sidebar{transform:translateX(100%);transition:.3s}.sidebar.open{transform:none;box-shadow:-14px 0 40px rgba(0,0,0,.35)}
.main{margin-right:0;padding:0 14px 60px}
.two-col,.three-col{grid-template-columns:1fr}
.chat-layout{grid-template-columns:1fr;height:auto}
.chat-channels{max-height:400px}
.chat-main{display:none;height:calc(100vh - 180px)}
.chat-layout.show-channel .chat-channels{display:none}
.chat-layout.show-channel .chat-main{display:flex}
.shift-grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:600px){
.grid2,.grid3{grid-template-columns:1fr}
.view-head .actions{width:100%}
.view-head .actions .search{flex:1;min-width:0}
.view-head .actions .btn{flex:1}
.assist-panel{width:calc(100vw - 20px);left:10px;bottom:80px;height:calc(100vh - 110px)}
.assist-fab{width:50px;height:50px;font-size:22px;bottom:16px;left:16px}
}
body.dense .card-body{padding:10px}
body.dense tbody td{padding:7px 9px}
body.dense thead th{padding:7px 9px}
body.dense .btn{padding:6px 11px;font-size:12.5px}
body.dense .field{margin-bottom:8px}
body.dense .stat{padding:10px}
body.comfortable .card-body{padding:22px}
body.comfortable tbody td{padding:14px 16px}
body.comfortable .btn{padding:11px 18px}
body.comfortable .field{margin-bottom:16px}
body.comfortable .stat{padding:18px}
.settings-tabs{display:flex;gap:4px;border-bottom:2px solid var(--border);margin-bottom:20px;overflow-x:auto;padding-bottom:2px}
.settings-tab{padding:11px 20px;font-size:13.5px;font-weight:700;color:var(--muted);border-radius:10px 10px 0 0;white-space:nowrap;border:none;background:none;cursor:pointer;transition:.2s}
.settings-tab:hover{background:var(--primary-l);color:var(--primary)}
.settings-tab.active{color:var(--primary);background:var(--primary-l);border-bottom:3px solid var(--primary);margin-bottom:-2px}
body.sidebar-left .sidebar{right:auto;left:0}
body.sidebar-left .main{margin-right:0}
body.sidebar-compact .nav-item{padding:8px 10px;font-size:12.5px}
body.sidebar-compact .nav-item span:not(.badge-mini){font-size:12px}
body.sidebar-compact .nav-section{padding:8px 10px 2px;font-size:9.5px}
body.sidebar-icons-only .nav-item span:not(.badge-mini){display:none}
body.sidebar-icons-only .nav-item{justify-content:center;padding:12px}
body.sidebar-icons-only .nav-item .badge-mini{position:absolute;margin:0;top:2px;left:2px;font-size:9px;padding:1px 5px}
body.sidebar-icons-only .nav-section{display:none}
body.sidebar-icons-only .brand-title,body.sidebar-icons-only .brand-sub{display:none}
body.sidebar-icons-only .user-name,body.sidebar-icons-only .user-role{display:none}
.card{border-radius:var(--card-radius,14px)!important}
.btn{border-radius:var(--btn-radius,10px)!important}
.field input,.field select,.field textarea{border-radius:calc(var(--btn-radius,10px) - 2px)!important}
.settings-tab{transition:all var(--transition-speed,.25s)}
.emp-form-panel{animation:fade .2s}
.emp-form-panel input[readonly]{background:var(--bg);cursor:not-allowed;font-weight:800;font-family:monospace;color:var(--primary)}
#modalBody textarea{font-family:inherit}
#profileRoot .user-avatar{background:linear-gradient(135deg,var(--primary),var(--purple))}
#profileRoot .btn.full{text-align:right;justify-content:flex-start}
@media(max-width:900px){#profileRoot .three-col{grid-template-columns:1fr}}
#empBody tr:hover{background:#f8fafc}
#empBody input[type=checkbox]{width:16px;height:16px;accent-color:var(--primary);cursor:pointer}
#empBody .badge{font-size:11px}
/* ══════════ 🎛️ Sidebar Toggle System ══════════ */
/* زر الإغلاق داخل القائمة */
.sidebar-close-btn{
  display:none;
  position:absolute;
  top:14px;
  left:14px;
  width:34px;
  height:34px;
  border-radius:10px;
  background:rgba(255,255,255,.1);
  color:#fff;
  font-size:16px;
  align-items:center;
  justify-content:center;
  border:1px solid rgba(255,255,255,.15);
  transition:.2s;
  z-index:10;
}
.sidebar-close-btn:hover{
  background:#dc2626;
  border-color:#dc2626;
}

/* خلفية معتمة عند فتح القائمة على الجوال */
.sidebar-backdrop{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(15,23,42,.55);
  backdrop-filter:blur(2px);
  z-index:55;
  animation:fade .2s;
}
.sidebar-backdrop.open{
  display:block;
}

/* على الجوال: أظهر زر الإغلاق */
@media(max-width:900px){
  .sidebar-close-btn{display:inline-flex;}
}

/* خيار: أيقونات فقط عند الإغلاق اليدوي على الشاشات الكبيرة */
body.sidebar-collapsed .sidebar{
  width:72px;
}
body.sidebar-collapsed .brand-title,
body.sidebar-collapsed .brand-sub,
body.sidebar-collapsed .nav-item span:not(.badge-mini),
body.sidebar-collapsed .nav-section,
body.sidebar-collapsed .user-name,
body.sidebar-collapsed .user-role{
  display:none;
}
body.sidebar-collapsed .nav-item{
  justify-content:center;
  padding:12px 8px;
}
body.sidebar-collapsed .nav-item .badge-mini{
  position:absolute;
  top:2px;
  left:2px;
  font-size:9px;
}
body.sidebar-collapsed .main{
  margin-right:72px;
}
body.sidebar-collapsed.sidebar-left .main{
  margin-right:0;
  margin-left:72px;
}
body.sidebar-collapsed .brand{
  justify-content:center;
}
body.sidebar-collapsed .user-chip{
  justify-content:center;
}
body.sidebar-collapsed .user-chip>div:not(.user-avatar){
  display:none;
}
body.sidebar-collapsed .logout-btn{
  margin:0;
}

/* الحركة الناعمة */
.sidebar{transition:transform .28s ease, width .28s ease;}
.main{transition:margin .28s ease;}
</style>

function toggleSidebar(){

  if(isMobile){
    // على الجوال: فتح/إغلاق كامل

  } else {
    // على الشاشات الكبيرة: وضع مصغّر (أيقونات فقط)

      if(typeof renderBIDashboard === 'function' && currentView === 'biDashboard') renderBIDashboard();

  }
}

function closeSidebar(){

}

  }).join('')}</div>`;
}
function compute360Score(c){const s=c.sources||[];let tw=0,ws=0;s.forEach(x=>{if(!x.submitted||!x.ratings?.length)return;const a=x.ratings.reduce((y,r)=>y+Number(r.score||0),0)/x.ratings.length;ws+=a*Number(x.weight||0);tw+=Number(x.weight||0);});return tw?ws/tw:0;}
function compute360Progress(c){const s=c.sources||[];if(!s.length)return 0;return Math.round((s.filter(x=>x.submitted).length/s.length)*100);}
function haversine(lat1,lng1,lat2,lng2){const R=6371000;const dLat=(lat2-lat1)*Math.PI/180,dLng=(lng2-lng1)*Math.PI/180;const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;return Math.round(R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a)));}
function getCurrentLocation(){return new Promise((res,rej)=>{if(!navigator.geolocation){rej(new Error('غير مدعوم'));return;}navigator.geolocation.getCurrentPosition(p=>res({lat:p.coords.latitude,lng:p.coords.longitude,accuracy:Math.round(p.coords.accuracy)}),e=>{let m='فشل';if(e.code===1)m='رفض';else if(e.code===2)m='غير متاح';else if(e.code===3)m='انتهت المهلة';rej(new Error(m));},{enableHighAccuracy:true,timeout:10000,maximumAge:0});});}
function checkGeofence(lat,lng){const g=state.geo||{};if(!g.companyLat||!g.companyLng)return{distance:null,inside:true,configured:false};const d=haversine(lat,lng,g.companyLat,g.companyLng);return{distance:d,inside:d<=(g.radius||200),configured:true};}

/* ══════════ Notifications ══════════ */
function computeNotifications(){
  const list=[],today=todayISO(),myId=myEmpId();

  if(canApprove()){
    const r=state.requests.filter(x=>x.status==='معلقة'&&x.empId!==myId);
    if(r.length)list.push({id:'req-p',ico:'📋',color:'yellow',title:`${r.length} طلب`,desc:'بانتظارك',action:'approvals',time:today});
    const c=state.claims.filter(x=>x.status==='معلقة'&&x.empId!==myId);
    if(c.length)list.push({id:'clm-p',ico:'💳',color:'orange',title:`${c.length} مطالبة`,desc:'',action:'claims',time:today});
  }

  if(myId){
    state.disciplinaries.filter(d=>d.empId===myId).sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,10).forEach(d=>list.push({id:'disc-'+d.id,ico:'⚖️',color:'red',title:'جزاء جديد: '+d.type,desc:(d.reason||'')+(d.deduction?' — خصم '+d.deduction:''),action:'disciplinary',time:d.date||today}));
    const myCh=getMyChannels();
    myCh.forEach(ch=>{const u=getChannelUnread(ch.id);if(u>0)list.push({id:`chat-${ch.id}`,ico:'💬',color:'blue',title:`${u} رسالة`,desc:ch.name,action:'chat',time:today});});

    state.reviewCycles.forEach(c=>c.sources.forEach(s=>{if(s.evaluatorId===myId&&!s.submitted)list.push({id:`r360-${s.id}`,ico:'🎯',color:'purple',title:`تقييم ${s.type}`,desc:empName(c.empId),action:'review360',time:today});}));

    const doneSurveys=new Set(state.surveyResponses.filter(r=>r.empId===myId).map(r=>r.surveyId));
    const pendingSurveys=state.surveys.filter(s=>s.status==='نشط'&&!doneSurveys.has(s.id));
    if(pendingSurveys.length)list.push({id:'sv-p',ico:'🎯',color:'purple',title:`${pendingSurveys.length} استبيان`,desc:'بانتظار مشاركتك',action:'engagement',time:today});

  }
state.branches.forEach(b=>{
  if(b.leaseEnd){
    const days=daysUntil(b.leaseEnd);
    if(days>=0&&days<=30)list.push({id:'br-'+b.id,ico:'🏬',color:'orange',title:`عقد إيجار ${b.name}`,desc:`ينتهي خلال ${days} يوم`,action:'branches',time:today});
    else if(days<0)list.push({id:'br-'+b.id,ico:'🏬',color:'red',title:`عقد إيجار ${b.name}`,desc:'منتهي!',action:'branches',time:today});
  }
});
state.contracts.forEach(c=>{
  if(c.end){

async function checkInNow(){
  const myId=myEmpId();if(!myId){toast('غير مرتبط','error');return;}
  const today=todayISO();
  if(state.attendance.find(a=>a.empId===myId&&a.date===today)){toast('⚠️ مسجل مسبقاً','error');return;}
  if(isPastAbsentTime(myId)){toast('⛔ أنت متأخر جدًا، الرجاء مراجعة مديرك','error');go('ess');return;}

  let geoData=null,inside=true,distance=null;
  if(state.geo?.enabled){
    toast('📍 جاري التحقق من موقعك...','');
    try{
      const loc=await getCurrentLocation();
      const check=checkGeofence(loc.lat,loc.lng);
      geoData={lat:loc.lat,lng:loc.lng,accuracy:loc.accuracy};
      inside=check.inside;distance=check.distance;
      state.locationLog.unshift({id:uid(),empId:myId,lat:loc.lat,lng:loc.lng,accuracy:loc.accuracy,
        distance:check.distance,insideGeofence:check.inside,timestamp:new Date().toISOString(),type:'checkin'});
      if(!check.inside){
        if(!confirm(`⚠️ أنت خارج نطاق الشركة (${check.distance}م — النطاق ${state.geo.radius}م).\n\nهل تريد تسجيل الحضور على أي حال؟`)){
          toast('تم الإلغاء','');return;
        }
      }
    }catch(e){
      const go2=confirm(`⚠️ تعذر تحديد الموقع (${e.message}).\n\nهل تريد تسجيل الحضور بدون GPS؟`);
      if(!go2)return;
      geoData=null;
    }
  }

  const now=nowTimeHM();
  const lateThreshold=state.settings?.lateThreshold||'08:15';
  const status=now>lateThreshold?'متأخر':'حاضر';
  state.attendance.push({id:uid(),empId:myId,date:today,status,checkIn:now,checkOut:'',overtime:0,
    geo:geoData?{lat:geoData.lat,lng:geoData.lng,accuracy:geoData.accuracy,inside,distance}:null});

  save();logAction('حضور','تسجيل دخول',empName(myId));
  toast(`✅ تم تسجيل الحضور ${now}${status==='متأخر'?' (متأخر)':''}`,'success');
  go('ess');
  renderNotifs();
}

async function checkOutNow(){
  const myId=myEmpId();if(!myId){toast('غير مرتبط','error');return;}
  const today=todayISO();
  const att=state.attendance.find(a=>a.empId===myId&&a.date===today);
  if(!att){toast('⚠️ لم تسجل حضورك اليوم','error');return;}
  if(att.checkOut){toast('⚠️ مسجل انصرافك مسبقاً','error');return;}

  let geoOut=null;
  if(state.geo?.enabled){
    try{
      const loc=await getCurrentLocation();
      const check=checkGeofence(loc.lat,loc.lng);
      geoOut={lat:loc.lat,lng:loc.lng,accuracy:loc.accuracy,inside:check.inside,distance:check.distance};
      state.locationLog.unshift({id:uid(),empId:myId,lat:loc.lat,lng:loc.lng,accuracy:loc.accuracy,
        distance:check.distance,insideGeofence:check.inside,timestamp:new Date().toISOString(),type:'checkout'});
    }catch(e){console.warn('GPS checkout failed',e);}
  }

  const now=nowTimeHM();
  att.checkOut=now;
  if(geoOut)att.geoOut=geoOut;
  const hours=hoursBetween(att.checkIn,now);
  if(hours>8)att.overtime=Math.round((hours-8)*100)/100;

  save();logAction('حضور','تسجيل انصراف',empName(myId));
  toast(`✅ تم تسجيل الانصراف ${now} — ${hours} ساعة`,'success');
  go('ess');
  renderNotifs();
}

function renderEmployeesTable(){
  const body=$('#empBody');if(!body)return;
  const f=empFilters;
  const q=(f.q||'').trim().toLowerCase();
  let list=state.employees.slice();
  if(q)list=list.filter(e=>
    (e.name||'').toLowerCase().includes(q)||
    (e.position||'').toLowerCase().includes(q)||
    (e.empNumber||'').toString().includes(q)||
    (e.phone||'').includes(q)||
    (e.email||'').toLowerCase().includes(q)||
    (e.nationalId||'').includes(q)
  );
  if(f.status)list=list.filter(e=>e.status===f.status);
  if(f.dept)list=list.filter(e=>e.deptId===f.dept);
  if(f.gender)list=list.filter(e=>e.gender===f.gender);
  if(f.branch)list=list.filter(e=>e.branch===f.branch);
// فلترة حسب شهر وسنة التعيين
if(f.month && f.year){
  list = list.filter(e => {
    if(!e.hireDate) return false;
    const d = new Date(e.hireDate);
    return (d.getMonth()+1) === Number(f.month) && d.getFullYear() === Number(f.year);
  });
}

  const counter=$('#empCount');if(counter)counter.textContent=list.length;

  if(!list.length){body.innerHTML=`<tr><td colspan="12" class="empty">لا موظفون مطابقون للفلتر</td></tr>`;return;}

  const avatarColors=['#4f46e5','#7c3aed','#0891b2','#16a34a','#d97706','#dc2626','#be185d','#0f766e'];
  body.innerHTML=list.map(e=>{
    const al=e.allowances||{};
    const totalSal=(Number(e.baseSalary)||0)+(al.housing||0)+(al.transport||0)+(al.food||0)+(al.supervision||0)+(al.yearsOfService||0)+(al.seniority||0);
    const color=avatarColors[(e.name||'').charCodeAt(0)%avatarColors.length];
    const isSel=empSelected.includes(e.id);
    return `<tr style="${isSel?'background:#eef2ff':''}">
      <td><input type="checkbox" ${isSel?'checked':''} onchange="toggleEmpSelect('${e.id}',this.checked)"></td>
      <td><span style="font-family:monospace;font-size:11.5px;background:#f1f5f9;padding:4px 8px;border-radius:6px">${esc(e.empNumber||'—')}</span></td>
      <td>
        <div style="display:flex;gap:8px;align-items:center">
          <div style="width:34px;height:34px;border-radius:10px;background:${color};color:#fff;display:grid;place-items:center;font-weight:800;font-size:12px;flex:none">${initials(e.name)}</div>
          <div>
            <div style="font-weight:700;font-size:13px">${esc(e.name)}</div>
            <div class="muted small" style="font-size:11px">${esc(e.position||'—')}</div>
          </div>
        </div>
      </td>
      <td>${e.gender?`<span class="badge ${e.gender==='ذكر'?'blue':'pink'}">${esc(e.gender)}</span>`:'—'}</td>
      <td>${e.nationality?esc(e.nationality):'—'}</td>
      <td>${esc(e.position||'—')}</td>
      <td>${esc(deptName(e.deptId))}</td>
      <td>${esc(e.branch||'—')}</td>
      <td>${e.shift?`<span class="badge yellow">${esc(e.shift)}</span>`:'—'}</td>
      <td><span dir="ltr" style="font-size:12px">${esc(e.phone||'—')}</span></td>
      <td>${statusBadge(e.status)}</td>
      <td>
        <div class="row-actions">
          <button class="btn sm ghost" onclick="viewEmpProfile('${e.id}')" title="عرض">👁</button>
          <button class="btn sm ghost" onclick="openEmployeeForm('${e.id}')" title="تعديل">✏️</button>
          <button class="btn sm danger" onclick="deleteEmployee('${e.id}')" title="حذف">🗑️</button>
          <button class="btn sm primary" onclick="quickEmpActions('${e.id}')" title="إجراءات">⚡</button>
        </div>
      </td>
    </tr>`;
  }).join('');
}

      </div>
    </div>

  `, ()=>{
    // ═══ Validation ═══
    const name=$('#ef_name').value.trim();
    const deptId=$('#ef_dept').value;

    if(!deptId){toast('⚠️ اختر القسم','error');showEmpTab('basic');return false;}
    const baseSalary=Number($('#ef_base').value)||0;
    if(baseSalary<=0){toast('⚠️ الراتب الأساسي مطلوب','error');showEmpTab('salary');return false;}

    // ═══ Account validation ═══
    const accUser=($('#ef_username')?.value||'').trim();
    const accPass=$('#ef_password')?.value||'';
    if(accUser||accPass){
      if(!accUser){toast('⚠️ أدخل اسم المستخدم','error');showEmpTab('account');return false;}
      if(!accPass){toast('⚠️ أدخل كلمة المرور','error');showEmpTab('account');return false;}
      const minLen=state.theme?.passwordMinLength||6;
      if(accPass.length<minLen){toast('⚠️ كلمة المرور يجب ألا تقل عن '+minLen+' أحرف','error');showEmpTab('account');return false;}
      const dup=(state.users||[]).find(u=>u.username.toLowerCase()===accUser.toLowerCase()&&u.empId!==(e?.id));
      if(dup){toast('⚠️ اسم المستخدم مستخدم لموظف آخر','error');showEmpTab('account');return false;}
    }

    // ═══ Collect ═══
    const v=id=>$('#'+id)?.value??'';
    const n=id=>Number($('#'+id)?.value)||0;

    const data={
      empNumber:v('ef_num')||nextNum,
      name, deptId,
      position:v('ef_pos').trim()||'—',
      nationalId:v('ef_nid').trim(),
      idExpiry:v('ef_nid_exp'),
      gender:v('ef_gender'),
      nationality:v('ef_nat'),
      maritalStatus:v('ef_marital'),
      birthday:v('ef_birthday'),
      shift:v('ef_shift'),
      leaveSystem:v('ef_leavesys'),
      annualLeave:n('ef_annual'),
      transferredLeave:n('ef_carry'),
      hireDate:v('ef_hire')||todayISO(),
      biometricId:v('ef_biometric').trim(),
      managerId:null,
      status:v('ef_status'),
     
// ...داخل data object
      branchId: v('ef_branch'),
      branch: state.branches.find(b => b.id === v('ef_branch'))?.name || '',
      contractNo:v('ef_contract').trim(),
      notes:v('ef_notes').trim(),
      phone:v('ef_phone').trim(),
      email:v('ef_email').trim(),
      country:v('ef_country').trim(),
      city:v('ef_city').trim(),
      address:v('ef_address').trim(),
      baseSalary,
      paymentMethod:v('ef_pay'),
      hourlyRate:n('ef_hourly'),
      dailyRate:n('ef_daily'),
      allowances:{
        housing:n('ef_housing'),
        transport:n('ef_transport'),
        food:n('ef_food'),
        supervision:n('ef_supervision'),
        yearsOfService:n('ef_years'),
        seniority:n('ef_seniority')
      },
      bank:{
        name:v('ef_bank'),
        iban:v('ef_iban').trim(),
        accountHolder:v('ef_holder').trim(),
        accountNumber:v('ef_accnum').trim()
      },
      emergency:{
        name:v('ef_emg_name').trim(),
        phone:v('ef_emg_phone').trim(),
        relationship:v('ef_emg_rel')
      },
      fees:{
        workPermit:n('ef_workpermit'),
        residence:n('ef_residence'),
        socialInsurance:n('ef_socialins')
      },
      insurance:{
        company:v('ef_ins_company').trim(),
        policy:v('ef_ins_policy').trim(),
        category:v('ef_ins_cat'),
        startDate:v('ef_ins_start'),
        endDate:v('ef_ins_end'),
        price:n('ef_ins_price')
      },
      att:{
        from:v('ef_att_from')||'08:00',to:v('ef_att_to')||'17:00',
        lateAfter:v('ef_att_late')||'08:15',lateDeduct:n('ef_att_latededuct'),
        earlyBefore:v('ef_att_early')||v('ef_att_to')||'17:00',earlyDeduct:n('ef_att_earlydeduct'),
        absentDeduct:n('ef_att_absentdeduct'),
        absentAfter:v('ef_att_absentafter')
      },
      passportNo:v('ef_passport').trim(),
      passportExpiry:v('ef_passport_exp'),
      taxNo:v('ef_tax').trim(),
      gosiNo:v('ef_gosi').trim(),
      licenseNo:v('ef_license').trim(),
      degreeNo:v('ef_degree').trim(),
      education:v('ef_education').trim(),
      experience:v('ef_experience').trim()
    };

    if(e){Object.assign(e,data);logAction('تعديل موظف','الموظفون',name);}
    else{
      const nid=uid();
      state.employees.push({id:nid,...data});
      // رصيد إجازات
      state.leaveBalances[nid]={
        'سنوية':{total:data.annualLeave||30,used:0},
        'مرضية':{total:15,used:0},
        'طارئة':{total:5,used:0}
      };
      logAction('إضافة موظف','الموظفون',name);
    }
    // ═══ حفظ حساب الدخول ═══
    if(accUser&&accPass){
      const empId=e?e.id:state.employees[state.employees.length-1].id;
      state.users=state.users||[];
      let u=state.users.find(x=>x.empId===empId);
      const role=$('#ef_role')?.value||u?.role||'employee';
      if(u){
        const wasSelf=session&&session.username===u.username;
        u.username=accUser;u.password=accPass;u.role=role;
        if(wasSelf){session.username=accUser;try{localStorage.setItem(SESSION_KEY,JSON.stringify(session));}catch(_){}}
      }else state.users.push({id:uid(),username:accUser,password:accPass,role,empId});
      logAction('تحديث حساب','الموظفون',accUser);
    }
    save();closeModal();renderEmployeesTable();buildNav();
    toast(id?'✅ تم التعديل':'🎉 تم إضافة الموظف','success');
    return true;
  },{
    wide:true,
    footerHTML:`
      <button type="button" class="btn ghost" onclick="closeModal()">إلغاء</button>
      <button type="button" class="btn primary" onclick="submitModal()">💾 حفظ الموظف</button>`
  });
}

  return `<div class="view-head"><h2>الحضور</h2><div class="actions"><input type="date" id="attDate" value="${todayISO()}" onchange="renderAttendanceTable()"></div></div>
  <div id="attStats" class="stats"></div>
  <div class="card table-wrap"><table><thead><tr><th>الموظف</th><th>الحضور</th><th>الانصراف</th><th>ساعات</th><th>GPS</th><th>الحالة</th></tr></thead>
    <tbody id="attBody"></tbody></table></div>`;
};
function renderAttendanceTable(){
  const body=$('#attBody');if(!body)return;
  const date=$('#attDate')?.value||todayISO();
  const list=state.attendance.filter(a=>a.date===date);
  const sEl=$('#attStats');
  if(sEl)sEl.innerHTML=statCard('حاضر',list.filter(a=>a.status==='حاضر').length,'✅','green')+statCard('متأخر',list.filter(a=>a.status==='متأخر').length,'⏰','yellow')+statCard('غائب',list.filter(a=>a.status==='غائب').length,'🚫','red')+statCard('إجازة',list.filter(a=>a.status==='إجازة').length,'🌴','blue');
  if(!list.length){body.innerHTML=emptyRow(6,'لا سجلات');return;}
  body.innerHTML=list.map(a=>{const e=empById(a.empId),h=hoursBetween(a.checkIn,a.checkOut);
    return `<tr><td><strong>${esc(e?.name||'—')}</strong></td><td dir="ltr">${a.checkIn||'—'}</td><td dir="ltr">${a.checkOut||'—'}</td><td>${h?h+' س':'—'}</td><td>${a.geo?`<span class="geo-badge ${a.geo.inside?'inside':'outside'}">${a.geo.inside?'✅':'⚠️'} ${a.geo.distance||0}م</span>`:'—'}</td><td>${statusBadge(a.status)}</td></tr>`;}).join('');
}

const AT_DAYS=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
let attMonth=(()=>{const d=new Date();return{y:d.getFullYear(),m:d.getMonth()};})();
function attMarks(){
  const saved=state.settings?.attMarks||{};const out={};
  Object.keys(ATT_DEFAULT_MARKS).forEach(k=>out[k]={...ATT_DEFAULT_MARKS[k],...(saved[k]||{})});
  return out;
}
function empAttCfg(e){
  const a=e?.att||{};
  return{
    from:a.from||'08:00',to:a.to||'17:00',
    lateAfter:a.lateAfter||'08:15',lateDeduct:Number(a.lateDeduct)||0,
    earlyBefore:a.earlyBefore||a.to||'17:00',earlyDeduct:Number(a.earlyDeduct)||0,
    absentDeduct:Number(a.absentDeduct)||0,
    absentAfter:a.absentAfter||''
  };
}
function empDailySalary(e,dim){
  const tot=Number(e?.baseSalary)||0;
  dim=dim||new Date(attMonth.y,attMonth.m+1,0).getDate();
  return Math.round(tot/dim*100)/100;
}
function attYMD(y,m,d){return y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');}
function attDayStatus(e,ds){
  const man=e.attManual?.[ds];
  if(man&&ATT_DEFAULT_MARKS[man]){const r0=state.attendance.find(a=>a.empId===e.id&&a.date===ds);return{k:man,rec:r0,manual:true};}
  if(e.hireDate&&ds<e.hireDate)return null;
  const cfg=empAttCfg(e);
  const rec=state.attendance.find(a=>a.empId===e.id&&a.date===ds);
  const wd=new Date(ds+'T12:00:00').getDay();
  const lv=(state.leaves||[]).filter(l=>l.empId===e.id&&l.status==='موافق'&&l.from<=ds&&ds<=(l.to||l.from));
  const unpaidL=lv.some(l=>(l.payType||(l.type==='بدون راتب'?'unpaid':'paid'))==='unpaid')&&!lv.some(l=>(l.payType||(l.type==='بدون راتب'?'unpaid':'paid'))==='paid');
  const onLeave=lv.length>0||(e.weeklyOff||[]).includes(wd);
  if(rec&&rec.status!=='إجازة'&&rec.status!=='غائب'){
    if(rec.checkIn&&cfg.absentAfter&&rec.checkIn>cfg.absentAfter)return{k:'absent',rec};
    if(rec.checkIn&&rec.checkIn>cfg.lateAfter)return{k:'late',rec};
    if(rec.checkOut&&rec.checkOut<cfg.earlyBefore)return{k:'early',rec};
    if(!rec.checkIn&&rec.status==='متأخر')return{k:'late',rec};
    return{k:'present',rec};
  }
  if(onLeave&&unpaidL&&!(e.weeklyOff||[]).includes(wd))return{k:'unpaid',rec};
  if(onLeave||rec?.status==='إجازة')return{k:'leave',rec};
  if(rec?.status==='غائب')return{k:'absent',rec};
  if(ds<todayISO())return{k:'absent'};
  return null;
}

function attMonthShift(n){
  attMonth.m+=n;if(attMonth.m<0){attMonth.m=11;attMonth.y--;}if(attMonth.m>11){attMonth.m=0;attMonth.y++;}
  renderMonthlyAttendance();
}
function attComputeRows(){
  const{y,m}=attMonth;const days=new Date(y,m+1,0).getDate();
  const marks=attMarks();
  const emps=state.employees.filter(e=>e.status!=='منتهي');
  return{y,m,days,marks,rows:emps.map(e=>{
    const cfg=empAttCfg(e),daily=empDailySalary(e,days);
    const cnt={present:0,absent:0,late:0,early:0,leave:0,unpaid:0};const cells=[];
    for(let d=1;d<=days;d++){
      const ds=attYMD(y,m,d);const st=attDayStatus(e,ds);
      if(st)cnt[st.k]++;
      cells.push({ds,st});
    }
    const worked=cnt.present+cnt.late+cnt.early;
    const paid=Math.min(days,worked+cnt.leave);
    const disc=(state.disciplinaries||[]).filter(d=>d.empId===e.id&&(d.date||'').slice(0,7)===y+'-'+String(m+1).padStart(2,'0')).reduce((a,d)=>a+(Number(d.deduction)||0),0);
    const deduct=disc+cnt.late*cfg.lateDeduct+cnt.early*cfg.earlyDeduct+(cnt.absent+cnt.unpaid)*cfg.absentDeduct;
    const total=Math.max(0,Math.round((paid*daily-deduct)*100)/100);
    return{e,cfg,daily,cnt,worked,deduct,total,cells};
  })};
}

      return `<td style="text-align:center;padding:4px 6px;cursor:pointer;${c.st.manual?'background:rgba(79,70,229,.08)':''}" ${oc} title="${esc(tip)}"><span style="color:${k.color};font-weight:800;font-size:18px">${esc(k.sym)}</span></td>`;

function parseLatLng(t){
  t=String(t||'').trim();
  let m=t.match(/@(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/)||t.match(/!3d(-?\d+(?:\.\d+)?)!4d(-?\d+(?:\.\d+)?)/)||t.match(/[?&](?:q|ll|query|destination)=(-?\d+(?:\.\d+)?)(?:,|%2C)\s*(-?\d+(?:\.\d+)?)/)||t.match(/^(-?\d+(?:\.\d+)?)\s*[,،\s]\s*(-?\d+(?:\.\d+)?)$/);
  if(!m)return null;const a=+m[1],b=+m[2];
  return(Math.abs(a)<=90&&Math.abs(b)<=180)?{lat:a,lng:b}:null;
}
function openGeoMapPicker(){
  const g=state.geo||{};
  const has=g.companyLat&&g.companyLng;
  const url=has?`https://www.google.com/maps/search/?api=1&query=${g.companyLat},${g.companyLng}`:'https://www.google.com/maps';
  openModal('🗺️ تحديد الموقع الأساسي',`
    <div class="form-note"><strong>الخطوات:</strong><br>1) اضغط «فتح خرائط جوجل» ثم ضع الدبوس على المكان المطلوب (اضغط مطولًا على الجوال، أو زر الفأرة الأيمن على الكمبيوتر).<br>2) انسخ الإحداثيات التي تظهر (أو انسخ رابط الصفحة) والصقها في الحقل أدناه.<br>3) حدّد النطاق بالمتر ثم احفظ.</div>
    <a class="btn primary full" href="${url}" target="_blank" rel="noopener" style="margin-bottom:12px;text-align:center">🗺️ فتح خرائط جوجل</a>
    <div class="field"><label>الصق الإحداثيات أو رابط الموقع</label><input id="gp_paste" dir="ltr" placeholder="24.467, 39.611  أو  https://www.google.com/maps/@24.46,39.61,17z" oninput="geoPickPreview()" value="${has?g.companyLat+', '+g.companyLng:''}"></div>
    <div class="muted small" id="gp_info" style="margin-bottom:10px"></div>
    <div class="field"><label>النطاق (متر)</label><input id="gp_radius" type="number" min="10" value="${g.radius||200}"></div>
    <button type="button" class="btn ghost full" onclick="geoPickMine()">📍 استخدم موقعي الحالي</button>`,
    ()=>{
      const p=parseLatLng($('#gp_paste').value);
      if(!p){toast('⚠️ إحداثيات غير صحيحة','error');return false;}
      const r=Number($('#gp_radius').value);if(!(r>0)){toast('⚠️ حدّد النطاق بالمتر','error');return false;}
      state.geo={enabled:true,companyLat:p.lat,companyLng:p.lng,radius:r};
      save();closeModal();if(currentView==='geolocation'){go('geolocation');}toast('✅ تم حفظ الموقع والنطاق','success');return true;
    },{footerHTML:`<button class="btn ghost" onclick="closeModal()">إلغاء</button><button class="btn primary" onclick="submitModal()">💾 حفظ</button>`});
  geoPickPreview();
}
function geoPickPreview(){
  const p=parseLatLng($('#gp_paste')?.value),i=$('#gp_info');if(!i)return;
  i.innerHTML=p?`✅ ${p.lat.toFixed(6)}, ${p.lng.toFixed(6)} — <a href="${gmapsLink(p.lat,p.lng)}" target="_blank" rel="noopener">معاينة على الخريطة</a>`:'';

function setLeaveStatus(id,status){

  const p=l.status;l.status=status;
  const bal=state.leaveBalances?.[l.empId]?.[l.type];

/* ══════════ دالة تحديث الملخص الحيّ ══════════ */
function updateLeaveSummary(){
  const isOwnRequest = isEmployee();
  const empId = isOwnRequest ? myEmpId() : ($('#l_emp')?.value || myEmpId());
  const type = $('#l_type')?.value || 'سنوية';
  const from = $('#l_from')?.value;
  const to = $('#l_to')?.value;

  // حساب عدد الأيام
  let days = 0;
  if(from && to){
    const d1 = new Date(from), d2 = new Date(to);
    if(d2 >= d1){
      days = Math.round((d2 - d1)/86400000) + 1;
    }
  }

  // تحديث الرقم الكبير في الهيرو
  const heroDays = $('#lv_hero_days');
  if(heroDays) heroDays.textContent = days;

  // تحديث كارت الملخص
  const typeEl = $('#lv_type'); if(typeEl) typeEl.textContent = type;
  const daysEl = $('#lv_days'); if(daysEl) daysEl.textContent = days;
  const empsEl = $('#lv_emps'); if(empsEl) empsEl.textContent = state.employees.length;

  // الرصيد
  const bal = state.leaveBalances?.[empId]?.[type];
  const remaining = bal ? Math.max(0, (bal.total||0) - (bal.used||0)) : 0;
  const balanceEl = $('#lv_balance');
  if(balanceEl) balanceEl.textContent = bal ? `${remaining} يوم` : '—';

  // المستحق حتى نهاية العام (تقديري: الرصيد + ما سيتراكم)
  const dueEl = $('#lv_due');
  if(dueEl){
    if(bal){
      const total = bal.total || 0;
      dueEl.textContent = `${total} يوم`;
    } else {
      dueEl.textContent = '—';
    }
  }

  // التنبيه السفلي
  const alertBox = $('#lv_balance_alert');
  if(alertBox){
    if(days > 0 && bal){
      if(days > remaining){
        alertBox.innerHTML = `<div class="leave-alert danger">⚠️ عدد الأيام المطلوبة (${days}) يتجاوز الرصيد المتاح (${remaining}). قد لا تتم الموافقة.</div>`;
      } else if(remaining - days < 3){
        alertBox.innerHTML = `<div class="leave-alert warn">ℹ️ بعد هذه الإجازة سيبقى لديك ${remaining - days} يوم فقط.</div>`;
      } else {
        alertBox.innerHTML = `<div class="leave-alert ok">✅ الرصيد كافٍ لطلب ${days} يوم (المتبقي بعد الطلب: ${remaining - days} يوم).</div>`;
      }
    } else {
      alertBox.innerHTML = '';
    }
  }

  // تنبيه التاريخ
  const hintEl = $('#lv_date_hint');
  if(hintEl){
    if(from && to && new Date(to) < new Date(from)){
      hintEl.style.color = '#dc2626';
      hintEl.textContent = '⚠️ تاريخ النهاية قبل تاريخ البداية!';
    } else {
      hintEl.style.color = '#64748b';
      hintEl.textContent = 'تأكد أن تاريخ النهاية يساوي أو يأتي بعد تاريخ البداية.';
    }
  }
}

function openReview360Evaluate(cycleId,sourceId){
  const cycle=state.reviewCycles.find(c=>c.id===cycleId);if(!cycle)return;
  const source=cycle.sources.find(s=>s.id===sourceId);if(!source)return;
  const emp=empById(cycle.empId);
  if(!source.ratings?.length)source.ratings=state.reviewCompetencies.map(c=>({competency:c.key,score:3,comment:''}));
  openModal('تقييم '+source.type+' — '+(emp?.name||''),`
    <div class="form-note">${esc(cycle.period)} · ${esc(source.type)}</div>
    <div id="r360_ratings">${state.reviewCompetencies.map(c=>{
      const r=source.ratings.find(x=>x.competency===c.key)||{score:3,comment:''};
      return `<div class="r360-comp" data-key="${c.key}" style="padding:12px;background:var(--bg);border-radius:10px;margin-bottom:10px">

      return{competency:el.dataset.key,score:a?Number(a.dataset.score):3,comment:el.querySelector('.r360-comment').value.trim()};});
    source.submitted=true;source.submittedAt=todayISO();

  w.querySelector('.r360-val').textContent=n.toFixed(1);

function filterChannels(query){
  const q = (query||'').trim().toLowerCase();

  if(!list) return;
  if(!channels.length){ list.innerHTML='<div class="muted small" style="text-align:center;padding:20px">لا نتائج</div>'; return; }
  list.innerHTML = channels.map(ch => {
    const last = getChannelLastMessage(ch.id);
    const unread = getChannelUnread(ch.id);
    const icon = ch.type==='public'?'📢':ch.type==='dept'?'🏢':'👤';
    return `<div class="chat-ch ${activeChannelId===ch.id?'active':''}" onclick="switchChannel('${ch.id}')">

}
function switchChannel(id){

  const layout = $('#chatLayout');
  if(layout && window.innerWidth<=900) layout.classList.add('show-channel');
  renderNotifs();
  buildNav();
}

views.biDashboard=function(){return '<div id="biRoot"></div>';};
function renderBIDashboard(){
  const root=$('#biRoot');if(!root)return;
  const now=new Date();
  if(!window._biF)window._biF={from:now.getFullYear()+'-01-01',to:todayISO(),deptId:'',compare:'none'};
  const f=window._biF;
  const inR=d=>d&&d>=f.from&&d<=f.to;
  const matchDept=eid=>!f.deptId||empById(eid)?.deptId===f.deptId;

  const active=state.employees.filter(e=>e.status==='يعمل'&&matchDept(e.id)).length;
  const attF=state.attendance.filter(a=>inR(a.date)&&matchDept(a.empId));
  const pr=attF.filter(a=>a.status==='حاضر'||a.status==='متأخر').length;
  const rate=attF.length?Math.round(pr/attF.length*100):0;
  const totalSalary=state.employees.filter(e=>e.status==='يعمل'&&matchDept(e.id)).reduce((s,e)=>{const al=e.allowances||{};return s+(Number(e.baseSalary)||0)+(al.housing||0)+(al.transport||0)+(al.food||0);},0);
  const claimsApproved=state.claims.filter(c=>c.status==='موافق'&&inR(c.date)&&matchDept(c.empId)).reduce((s,c)=>s+c.amount,0);
  const leavesApproved=state.leaves.filter(l=>l.status==='موافق'&&inR(l.from)&&matchDept(l.empId)).reduce((s,l)=>s+l.days,0);
  const turnover=Math.round(state.employees.filter(e=>e.status==='منتهي').length/Math.max(1,state.employees.length)*100);
  const avgTenure=(()=>{const list=state.employees.filter(e=>e.hireDate&&matchDept(e.id));
    if(!list.length)return 0;const total=list.reduce((s,e)=>s+Math.max(0,Math.floor((new Date()-new Date(e.hireDate))/86400000/365)),0);
    return (total/list.length).toFixed(1);})();

  // 🔄 بيانات المقارنة
  let cmpData=null;
  if(f.compare!=='none'){
    const days=f.compare==='prev-month'?30:f.compare==='prev-quarter'?90:365;
    const pFrom=isoDate(addDays(new Date(f.from),-days)),pTo=isoDate(addDays(new Date(f.to),-days));
    const inP=d=>d&&d>=pFrom&&d<=pTo;
    const pAtt=state.attendance.filter(a=>inP(a.date)&&matchDept(a.empId));
    const pPr=pAtt.filter(a=>a.status==='حاضر'||a.status==='متأخر').length;
    cmpData={
      rate:pAtt.length?Math.round(pPr/pAtt.length*100):0,
      salary:state.employees.filter(e=>e.status==='يعمل'&&matchDept(e.id)).reduce((s,e)=>{const al=e.allowances||{};return s+(Number(e.baseSalary)||0)+(al.housing||0)+(al.transport||0)+(al.food||0);},0),
      claims:state.claims.filter(c=>c.status==='موافق'&&inP(c.date)&&matchDept(c.empId)).reduce((s,c)=>s+c.amount,0),
      leaves:state.leaves.filter(l=>l.status==='موافق'&&inP(l.from)&&matchDept(l.empId)).reduce((s,l)=>s+l.days,0)};
  }
  const delta=(cur,prev,rev=false)=>{
    if(cmpData===null||prev===undefined||prev===null)return '';
    const diff=cur-prev;
    if(diff===0)return '<span class="muted small"> = </span>';
    const up=rev?diff<0:diff>0;
    const arrow=diff>0?'▲':'▼';
    const color=up?'var(--green)':'var(--red)';
    const pct=prev?Math.abs(Math.round(diff/prev*100)):100;
    return `<span class="small" style="color:${color};margin-inline-start:6px">${arrow} ${pct}%</span>`;
  };

  root.innerHTML=`
    <div class="view-head"><h2>📈 BI Dashboard 2.0</h2>
      <div class="actions">
        <button class="btn ghost sm" onclick="exportBIData()">⬇ CSV</button>
        <button class="btn ghost sm" onclick="printBIDashboard()">🖨 PDF</button>
      </div></div>
    <div class="card" style="margin-bottom:16px"><div class="card-body">
      <div class="grid3">
        <div class="field" style="margin:0"><label>من</label><input type="date" value="${f.from}" onchange="window._biF.from=this.value;renderBIDashboard()"></div>
        <div class="field" style="margin:0"><label>إلى</label><input type="date" value="${f.to}" onchange="window._biF.to=this.value;renderBIDashboard()"></div>
        <div class="field" style="margin:0"><label>القسم</label><select onchange="window._biF.deptId=this.value;renderBIDashboard()">
          <option value="">كل الأقسام</option>${state.departments.map(d=>`<option value="${d.id}" ${f.deptId===d.id?'selected':''}>${esc(d.name)}</option>`).join('')}</select></div>
        <div class="field" style="margin:0"><label>المقارنة</label><select onchange="window._biF.compare=this.value;renderBIDashboard()">
          <option value="none" ${f.compare==='none'?'selected':''}>بدون</option>
          <option value="prev-month" ${f.compare==='prev-month'?'selected':''}>الشهر السابق</option>
          <option value="prev-quarter" ${f.compare==='prev-quarter'?'selected':''}>الربع السابق</option>
          <option value="prev-year" ${f.compare==='prev-year'?'selected':''}>السنة السابقة</option>
        </select></div>
        <div class="field" style="margin:0"><label>&nbsp;</label>
          <button class="btn primary full" onclick="renderBIDashboard()">🔄 تحديث</button></div>
      </div>
    </div></div>

    <div class="stats">
      ${statCard('موظفون نشطون',active,'👥','blue')}
      ${statCard('معدل الحضور',rate+'%'+delta(rate,cmpData?.rate),'🕐','green')}
      ${statCard('إجمالي الرواتب',money(totalSalary)+delta(totalSalary,cmpData?.salary,true),'💰','purple')}
      ${statCard('مطالبات معتمدة',money(claimsApproved)+delta(claimsApproved,cmpData?.claims,true),'💳','orange')}
      ${statCard('إجازات معتمدة',leavesApproved+' يوم'+delta(leavesApproved,cmpData?.leaves,true),'🌴','teal')}
      ${statCard('معدل دوران',turnover+'%','🔄','red')}
      ${statCard('متوسط الخدمة',avgTenure+' سنة','📆','gray')}
    </div>

    <div class="two-col" style="margin-bottom:16px">
      <div class="card"><div class="card-head"><h3>🏢 توزيع الموظفين</h3></div><div class="chart-wrap"><canvas id="biChartDept"></canvas></div></div>
      <div class="card"><div class="card-head"><h3>💼 الرواتب حسب القسم</h3></div><div class="chart-wrap"><canvas id="biChartSalary"></canvas></div></div>
    </div>
    <div class="two-col" style="margin-bottom:16px">
      <div class="card"><div class="card-head"><h3>📊 الحضور اليومي</h3></div><div class="chart-wrap"><canvas id="biChartAtt"></canvas></div></div>
      <div class="card"><div class="card-head"><h3>🌴 الإجازات حسب النوع</h3></div><div class="chart-wrap"><canvas id="biChartLeaves"></canvas></div></div>
    </div>
    <div class="card">
      <div class="card-head"><h3>🏆 أداء الأقسام</h3></div>
      <div class="table-wrap"><table><thead>
        <tr><th>القسم</th><th>الموظفون</th><th>معدل الحضور</th><th>متوسط الراتب</th><th>إجازات</th><th>مطالبات</th></tr></thead>
        <tbody>${state.departments.map(d=>{
          const emps=state.employees.filter(e=>e.deptId===d.id&&e.status==='يعمل');
          const dAtt=state.attendance.filter(a=>inR(a.date)&&emps.some(e=>e.id===a.empId));
          const dPr=dAtt.filter(a=>a.status==='حاضر'||a.status==='متأخر').length;
          const dRate=dAtt.length?Math.round(dPr/dAtt.length*100):0;
          const avgSal=emps.length?Math.round(emps.reduce((s,e)=>s+(Number(e.baseSalary)||0),0)/emps.length):0;
          const dLeaves=state.leaves.filter(l=>inR(l.from)&&emps.some(e=>e.id===l.empId)&&l.status==='موافق').length;
          const dClaims=state.claims.filter(c=>inR(c.date)&&emps.some(e=>e.id===c.empId)&&c.status==='موافق').length;
          return `<tr><td><strong>${esc(d.name)}</strong></td><td>${emps.length}</td>
            <td><span class="badge ${dRate>=90?'green':dRate>=70?'yellow':'red'}">${dRate}%</span></td>
            <td>${money(avgSal)}</td><td>${dLeaves}</td><td>${dClaims}</td></tr>`;}).join('')}
        </tbody></table></div>
    </div>`;

  const isDark=document.body.classList.contains('dark');
  const gc=isDark?'#334155':'#e2e8f0',tc=isDark?'#cbd5e1':'#475569';
  Chart.defaults.font.family='Tajawal, sans-serif';Chart.defaults.color=tc;

  const deptData=state.departments.map((d,i)=>({name:d.name,count:state.employees.filter(e=>e.deptId===d.id&&e.status==='يعمل').length,color:['#4f46e5','#16a34a','#f59e0b','#dc2626','#7c3aed','#0891b2'][i%6]}));
  if($('#biChartDept'))charts.biDept=new Chart($('#biChartDept'),{type:'doughnut',
    data:{labels:deptData.map(x=>x.name),datasets:[{data:deptData.map(x=>x.count),backgroundColor:deptData.map(x=>x.color),borderWidth:0}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'}}}});

  const salData=state.departments.map(d=>{const emps=state.employees.filter(e=>e.deptId===d.id&&e.status==='يعمل');
    return{name:d.name,total:emps.reduce((s,e)=>{const al=e.allowances||{};return s+(Number(e.baseSalary)||0)+(al.housing||0)+(al.transport||0)+(al.food||0);},0)};});
  if($('#biChartSalary'))charts.biSalary=new Chart($('#biChartSalary'),{type:'bar',
    data:{labels:salData.map(x=>x.name),datasets:[{label:'إجمالي الرواتب',data:salData.map(x=>x.total),backgroundColor:'#4f46e5',borderRadius:8}]},
    options:{responsive:true,maintainAspectRatio:false,indexAxis:'y',plugins:{legend:{display:false}},scales:{x:{grid:{color:gc}},y:{grid:{display:false}}}}});

  // حضور آخر 14 يوم
  const attDays=[],attPr=[],attAb=[];
  for(let i=13;i>=0;i--){const d=addDays(new Date(),-i),iso=isoDate(d);
    attDays.push(d.toLocaleDateString('ar-EG',{day:'numeric',month:'numeric'}));
    const r=state.attendance.filter(a=>a.date===iso&&matchDept(a.empId));
    attPr.push(r.filter(a=>a.status==='حاضر'||a.status==='متأخر').length);
    attAb.push(r.filter(a=>a.status==='غائب').length);}
  if($('#biChartAtt'))charts.biAtt=new Chart($('#biChartAtt'),{type:'line',
    data:{labels:attDays,datasets:[
      {label:'حاضر',data:attPr,borderColor:'#16a34a',backgroundColor:'rgba(22,163,74,.15)',fill:true,tension:.3,borderWidth:2},
      {label:'غائب',data:attAb,borderColor:'#dc2626',backgroundColor:'rgba(220,38,38,.15)',fill:true,tension:.3,borderWidth:2}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'}},scales:{x:{grid:{display:false}},y:{grid:{color:gc},beginAtZero:true}}}});

  // إجازات
  const leaveTypes={};state.leaves.filter(l=>inR(l.from)&&l.status==='موافق'&&matchDept(l.empId)).forEach(l=>{leaveTypes[l.type]=(leaveTypes[l.type]||0)+l.days;});
  if($('#biChartLeaves'))charts.biLeaves=new Chart($('#biChartLeaves'),{type:'pie',
    data:{labels:Object.keys(leaveTypes).length?Object.keys(leaveTypes):['—'],
      datasets:[{data:Object.keys(leaveTypes).length?Object.values(leaveTypes):[1],backgroundColor:['#4f46e5','#16a34a','#f59e0b','#dc2626','#7c3aed'],borderWidth:0}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'}}}});
}
function printBIDashboard(){

function exportBIData(){
  const lines=['BI Dashboard',''];
  lines.push('القسم,الموظفون,إجمالي الرواتب');
  state.departments.forEach(d=>{
    const emps=state.employees.filter(e=>e.deptId===d.id&&e.status==='يعمل');
    const total=emps.reduce((s,e)=>{const al=e.allowances||{};return s+(Number(e.baseSalary)||0)+(al.housing||0)+(al.transport||0)+(al.food||0);},0);
    lines.push(`"${d.name}",${emps.length},${total}`);});
  const csv='\ufeff'+lines.join('\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='bi-'+todayISO()+'.csv';
  document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(a.href);toast('⬇ تم التصدير','success');
}

function sendAssistantViewMsg(){
  const input=$('#assistViewInput');if(!input)return;
  const text=input.value.trim();if(!text||assistantProcessing)return;
  assistantHistory.push({role:'user',text,ts:new Date()});
  input.value='';renderAssistantView();
  assistantProcessing=true;
  setTimeout(()=>{
    const r=parseAssist(text);
    assistantHistory.push({role:'bot',text:r,ts:new Date()});
    assistantProcessing=false;
    renderAssistantView();
    try{renderAssistBody();}catch(e){}
  },400);
}
















function getEmpFinancials(empId,month){
  const emp=empById(empId);if(!emp)return null;
  const al=emp.allowances||{},fees=emp.fees||{},ins=emp.insurance||{};
  const base=Number(emp.baseSalary)||0;
  const allowances=Number(al.housing||0)+Number(al.transport||0)+Number(al.food||0)+Number(al.supervision||0)+Number(al.yearsOfService||0)+Number(al.seniority||0);
  const att=state.attendance.filter(a=>a.empId===empId&&a.date?.startsWith(month));
  const absentDays=att.filter(a=>a.status==='غائب').length;
  const lateCount=att.filter(a=>a.status==='متأخر').length;
  const workDays=att.length||26;
  const dailyRate=Math.round((base+allowances)/workDays*100)/100;
  const hourlyRate=Math.round(dailyRate/8*100)/100;
  const absentDeduction=absentDays*dailyRate;
  const lateDeduction=lateCount*hourlyRate*0.5;
  const totalDeduction=absentDeduction+lateDeduction;
  const debts=state.debts.filter(d=>d.empId===empId);
  const totalDebt=debts.reduce((s,d)=>s+d.amount,0);
  const paidDebt=debts.reduce((s,d)=>s+(d.paid||0),0);
  const remainingDebt=totalDebt-paidDebt;
  const adminFees=Number(fees.workPermit||0)+Number(fees.residence||0)+Number(fees.socialInsurance||0)+Number(ins.price?ins.price/12:0);
  const gross=base+allowances;
  const net=gross-totalDeduction-adminFees;
  return{base,allowances,absentDays,lateCount,workDays,dailyRate,hourlyRate,absentDeduction,lateDeduction,totalDeduction,adminFees,gross,net,totalDebt,paidDebt,remainingDebt};
}

views.calendar=function(){
  const now=new Date(),y=now.getFullYear(),m=now.getMonth();
  const startDay=new Date(y,m,1).getDay(),dim=new Date(y,m+1,0).getDate();
  const monthNames=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
  let h='';
  h+=['أحد','إثنين','ثلاثاء','أربعاء','خميس','جمعة','سبت'].map(d=>`<div style="text-align:center;font-size:12px;font-weight:700;color:var(--muted);padding:8px 0">${d}</div>`).join('');
  for(let i=startDay-1;i>=0;i--)h+='<div></div>';
  for(let d=1;d<=dim;d++){
    const iso=`${y}-${pad(m+1)}-${pad(d)}`;
    const isT=iso===todayISO();
    // 🔥 جمع الأحداث لهذا اليوم
    const dayLeaves=state.leaves.filter(l=>l.status==='موافق'&&l.from<=iso&&l.to>=iso);
    const dayMeetings=state.meetings.filter(mt=>mt.datetime.startsWith(iso));
    const dayBirthdays=state.employees.filter(e=>e.birthday===iso);
    let badges='';
    dayBirthdays.slice(0,1).forEach(()=>{badges+=`<span title="عيد ميلاد">🎂</span> `;});
    dayLeaves.slice(0,1).forEach(()=>{badges+=`<span title="إجازة">🌴</span> `;});
    dayMeetings.slice(0,1).forEach(mt=>{badges+=`<span title="${esc(mt.title)}">🎥</span> `;});
    h+=`<div class="shift-cell ${isT?'today':''}" style="min-height:70px">
      <div style="font-size:13px;font-weight:700;margin-bottom:4px">${d}</div>
      <div style="font-size:14px;line-height:1.4">${badges}</div>
    </div>`;
  }
  return `<div class="view-head"><h2>📅 التقويم</h2></div>
  <div class="card"><div class="card-head"><h3>${monthNames[m]} ${y}</h3></div>
    <div class="card-body">
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px">${h}</div>
      <div style="margin-top:14px;display:flex;gap:16px;flex-wrap:wrap;font-size:12px" class="muted">
        <span>🎂 عيد ميلاد</span>
        <span>🌴 إجازة</span>
        <span>🎥 اجتماع</span>
        <span>👥 ورديات</span>
      </div>
    </div>
  </div>`;
};

function previewDocument(docId){
  const d = state.documents.find(x => x.id === docId);
  if(!d){ toast('⚠️ الوثيقة غير موجودة','error'); return; }
  if(!d.fileData){ toast('ℹ️ لا يوجد ملف مرفق بهذه الوثيقة','info'); return; }

  const emp = empById(d.empId);
  const isPdf = (d.fileName||'').toLowerCase().endsWith('.pdf') || d.fileData.startsWith('data:application/pdf');
  const isImage = d.fileData.startsWith('data:image/');

  if(!isPdf && !isImage){
    toast('ℹ️ لا يمكن معاينة هذا النوع من الملفات','info');
    return;
  }

  const body = isImage
    ? `<div style="text-align:center;padding:10px;background:#f8fafc;border-radius:12px;max-height:70vh;overflow:auto">
         <img src="${d.fileData}" alt="${esc(d.fileName||'')}" style="max-width:100%;max-height:65vh;border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.08)">
       </div>`
    : `<div style="border-radius:12px;overflow:hidden;background:#f8fafc">
         <iframe src="${d.fileData}" style="width:100%;height:70vh;border:none;border-radius:8px"></iframe>
       </div>`;

  const meta = `
    <div style="display:flex;gap:14px;flex-wrap:wrap;padding:12px 14px;background:#eef2ff;border:1px solid #c7d2fe;border-radius:10px;margin-bottom:14px;font-size:12.5px">
      <div><strong>الموظف:</strong> ${esc(emp?.name||'—')}</div>
      <div><strong>النوع:</strong> ${esc(d.type||'—')}</div>
      ${d.number?`<div><strong>الرقم:</strong> ${esc(d.number)}</div>`:''}
      ${d.issueDate?`<div><strong>الإصدار:</strong> ${esc(d.issueDate)}</div>`:''}
      ${d.expiryDate?`<div><strong>الانتهاء:</strong> ${esc(d.expiryDate)}</div>`:''}
      ${d.fileSize?`<div><strong>الحجم:</strong> ${(d.fileSize/1024).toFixed(1)} KB</div>`:''}
    </div>`;

  openModal(`👁️ معاينة: ${esc(d.fileName||d.name)}`, meta + body, () => {}, {
    wide: true,
    footerHTML: `
      <button class="btn ghost" onclick="closeModal()">إغلاق</button>
      <a class="btn primary" href="${d.fileData}" download="${esc(d.fileName||d.name)}">⬇ تحميل</a>
    `
  });
}

function setDocRenewalTab(t){

  docRenewalState.selected = [];
